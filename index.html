// preenche os 27 itens a partir de um nível-base por bloco e aplica exceções
function nv(cog, emo, soc, exc = {}) {
  const o = {};
  BLOCOS.forEach(b => {
    const base = b.id === 'cognitivo' ? cog : b.id === 'emocional' ? emo : soc;
    b.itens.forEach(i => { o[i.id] = base; });
  });
  return { ...o, ...exc };
}

  return Object.fromEntries(MANIFESTACOES.map(m => [
    m.id,

  ]));
}

}

const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

function formatarData(iso) {
  if (!iso) return '—';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}
function dataPorExtenso(iso) {
  const [a, m, d] = iso.split('-');
  return `${Number(d)} de ${MESES[Number(m) - 1]} de ${a}`;
}
function mesmoMes(iso, ref) {
  const [a, m] = iso.split('-').map(Number);
  return a === ref.getFullYear() && m === ref.getMonth() + 1;
}
function iniciais(nome) {
  const p = nome.replace(/^(Prof\.ª|Prof\.|Psic\.|Coord\.)\s*/, '').trim().split(/\s+/);
  return (p[0][0] + (p[p.length - 1][0] || '')).toUpperCase();
}
function primeiroNome(nome) {
  return nome.replace(/^(Prof\.ª|Prof\.|Psic\.|Coord\.)\s*/, '').trim().split(/\s+/)[0];
}
function listar(itens) {
  if (!itens.length) return '';
  if (itens.length === 1) return itens[0];
  return itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1];
}
function minusculo(t) { return t.charAt(0).toLowerCase() + t.slice(1); }
function nl(n) { return n.toFixed(1).replace('.', ','); }

function semente(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) { h ^= texto.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function variar(opcoes, sem, giro) { return opcoes[(sem + giro * 7) % opcoes.length]; }

/* O professor registra DIFICULDADE (1 = nenhuma, 5 = acentuada). Exibir isso direto
   faria o avanço do aluno aparecer como linha descendo. Nas visualizações a escala é
   invertida para DESEMPENHO (1 = apoio contínuo, 5 = autônomo): subir = avançar. */
function desempenho(nivel) { return 6 - nivel; }
const ROTULO_DESEMPENHO = { 5: 'Autônomo', 4: 'Apoio pontual', 3: 'Mediação', 2: 'Apoio frequente', 1: 'Apoio contínuo' };
function rotuloDesempenho(v) { return ROTULO_DESEMPENHO[Math.max(1, Math.min(5, Math.round(v)))]; }

/* A leitura integrada não calcula média. Em cada conjunto usamos o nível
   predominante (moda); em caso de empate, prevalece o que pede mais apoio. */
function nivelPredominante(valores) {
  const validos = valores.filter(v => Number.isFinite(Number(v))).map(v => Math.max(1, Math.min(5, Math.round(Number(v)))));
  if (!validos.length) return 3;
  const contagem = validos.reduce((acc, v) => ({ ...acc, [v]: (acc[v] || 0) + 1 }), {});
  return Object.keys(contagem).map(Number).sort((a, b) => contagem[b] - contagem[a] || b - a)[0];
}
function nivelBloco(niveis, blocoId) {
  const itens = BLOCOS.find(b => b.id === blocoId).itens;
  return nivelPredominante(itens.map(i => niveis[i.id]));
}
function perfisDe(niveis) {
  return Object.fromEntries(BLOCOS.map(b => [b.id, nivelBloco(niveis, b.id)]));
}
function nivelGeral(perfis) {
  return nivelPredominante(BLOCOS.map(b => perfis[b.id]));
}

/* ── Consolidação: o perfil do período corrente é CALCULADO a partir das
      fichas efetivamente enviadas pelos professores. ─────────────────── */
function enviadas(aluno) { return aluno.respostas.filter(r => r.status === 'Enviado'); }
function pendentes(aluno) { return aluno.respostas.filter(r => r.status === 'Pendente'); }

function consolidar(aluno) {
  const envs = enviadas(aluno);
  if (!envs.length) return null;
  const niveis = {};
  ITENS.forEach(i => {
    niveis[i.id] = nivelPredominante(envs.map(r => r.niveis[i.id]));
  });
  return { periodo: PERIODO_ATUAL, niveis, perfis: perfisDe(niveis), respostas: envs.length, consolidado: true, criterio: 'predominancia' };
}

function periodos(aluno) {
  const atual = consolidar(aluno);
  const historico = aluno.historico.map(h => ({
    ...h,
    perfis: Object.fromEntries(BLOCOS.map(b => [b.id, Math.max(1, Math.min(5, Math.round(h.perfis[b.id]))) ]))
  }));
  return atual ? [...historico, atual] : historico;
}
function periodoAtual(aluno) {
  const p = periodos(aluno);
  return p[p.length - 1];
}
function statusDoc(doc) { return doc ? doc.status : null; }

/* ── Adaptações, acessibilidades e recursos ──────────────────────
   O formato anterior guardava tudo em um único campo "adaptacao".
   A leitura abaixo mantém essas respostas fictícias compatíveis e passa
   a separar o que acontece na avaliação, na rotina e no uso de recursos. */
const RECURSOS_ASSISTIVOS = [
  'Abafador de ruído', 'Calculadora', 'Material concreto',
  'Agenda visual', 'Roteiro impresso', 'Dispositivo digital'
];

function acessibilidadesDe(resposta) {
  if (resposta && resposta.acessibilidades) {
    const a = resposta.acessibilidades;
    return {
      avaliacao: { usa: !!(a.avaliacao && a.avaliacao.usa), descricao: (a.avaliacao && a.avaliacao.descricao) || '' },
      rotina: { usa: !!(a.rotina && a.rotina.usa), descricao: (a.rotina && a.rotina.descricao) || '' },
      recursos: {
        usa: !!(a.recursos && a.recursos.usa),
        itens: a.recursos && Array.isArray(a.recursos.itens) ? [...a.recursos.itens] : [],
        outros: (a.recursos && a.recursos.outros) || ''
      }
    };
  }

  const legado = resposta && resposta.adaptacao ? resposta.adaptacao : { necessita: false, quais: '' };
  const texto = legado.quais || '';
  const indicaAvaliacao = !!legado.necessita && /avalia|prova|tempo ampliado|enunciado|quest(ão|ões)|correç|produção escrita/i.test(texto);
  const indicaRotina = !!legado.necessita && /rotina|agenda visual|sequência das atividades|dupla fixa|pausa ativa|lista curta|registro em esquema/i.test(texto);
  const inferidos = RECURSOS_ASSISTIVOS.filter(item => {
    if (item === 'Material concreto') return /material concreto/i.test(texto);
    if (item === 'Agenda visual') return /agenda visual|rotina visual/i.test(texto);
    if (item === 'Roteiro impresso') return /roteiro impresso/i.test(texto);
    if (item === 'Calculadora') return /calculadora/i.test(texto);
    if (item === 'Abafador de ruído') return /abafador/i.test(texto);
    return /dispositivo|tablet|computador/i.test(texto);
  });

  return {
    avaliacao: { usa: indicaAvaliacao || (!!legado.necessita && !indicaRotina), descricao: indicaAvaliacao || !indicaRotina ? texto : '' },
    rotina: { usa: indicaRotina, descricao: indicaRotina ? texto : '' },
    recursos: { usa: inferidos.length > 0, itens: inferidos, outros: '' }
  };
}

function textoRecursos(recursos) {
  const itens = [...(recursos.itens || [])];
  if (recursos.outros && recursos.outros.trim()) itens.push(recursos.outros.trim());
  return itens.length ? listar(itens) : 'uso informado, sem recurso especificado';
}

function temAcessibilidade(a) {
  return a.avaliacao.usa || a.rotina.usa || a.recursos.usa;
}

/* ── Atendimento Educacional Especializado ─────────────────────── */
const RECURSOS_AEE = [
  'Agenda visual', 'Roteiro impresso', 'Material concreto',
  'Abafador de ruído', 'Calculadora', 'Comunicação alternativa',
  'Letras ou números móveis', 'Dispositivo digital'
];

function respostaAEEVazia() {
  return {
    status: 'Pendente', frequencia: '', potencialidades: '', objetivos: '',
    intervencoes: '', recursos: [], recursosOutros: '', evolucao: '',
    articulacao: '', orientacoes: '', observacoes: '', enviadoEm: null
  };
}

function normalizarAEE(aluno) {
  const origem = aluno.aee || AEE_SEMENTE[aluno.id];
  if (!origem) return { frequenta: false, resposta: respostaAEEVazia() };
  return {
    frequenta: !!origem.frequenta,
    resposta: origem.resposta
      ? { ...respostaAEEVazia(), ...JSON.parse(JSON.stringify(origem.resposta)) }
      : respostaAEEVazia()
  };
}

function frequentaAEE(aluno) { return !!(aluno.aee && aluno.aee.frequenta); }
function professoresConcluiram(aluno) { return aluno.respostas.length > 0 && pendentes(aluno).length === 0; }
function respostaAEE(aluno) { return aluno.aee && aluno.aee.resposta ? aluno.aee.resposta : respostaAEEVazia(); }
function statusFluxoAEE(aluno) {
  if (!frequentaAEE(aluno)) return 'Não se aplica';
  if (!professoresConcluiram(aluno)) return 'Aguardando professores';
  return respostaAEE(aluno).status || 'Pendente';
}
function alunosDoAEE(alunos) { return alunos.filter(frequentaAEE); }

/* ── Atribuições: docente ⇄ ficha ─────────────────────────────── */
function turmaDe(aluno) { return TURMAS.find(t => t.id === aluno.turmaId) || null; }
function docentesDoSegmento(seg) { return DOCENTES.filter(d => d.segmentos.includes(seg)); }
function respostaDoDocente(aluno, d) { return aluno.respostas.find(r => r.professor === d.nome && r.area === d.papel) || null; }

// uma atribuição nova nasce como ficha pendente, com os níveis no ponto central
function fichaPendente(docente, segmento) {
  const base = {
    area: docente.papel, professor: docente.nome, disciplina: docente.disciplina,
    niveis: nv(3, 3, 3), manifestacoes: JSON.parse(JSON.stringify(SEM_MANIF)),
    comentariosBloco: comentariosBlocoDe(null),
    observacoes: '', adaptacao: { necessita: false, quais: '' },
    acessibilidades: acessibilidadesDe(null), estrategias: '', outras: '',
    status: 'Pendente', enviadoEm: null
  };
  if (fichaPolivalente(segmento)) base.areasDesc = Object.fromEntries(AREAS_DESC.map(x => [x.id, '']));
  else base.dificuldadeDisciplina = { tem: false, texto: '' };
  return base;
}

// aluno recém-incluído no acompanhamento: sem histórico, sem documentos
function alunoDeMatricula(m) {
  const t = TURMAS.find(x => x.id === m.turmaId);
  return {
    id: 'novo-' + m.id, matriculaId: m.id, nome: m.nome, genero: m.genero, idade: m.idade,
    serie: t.serie, serieExtenso: t.serieExtenso, segmento: t.segmento, categoria: m.hipotese,
    turma: `${t.nome} — turno ${t.turno}`, turmaId: t.id,
    referencia: 'Núcleo de Apoio à Aprendizagem', referenciaProsa: 'o Núcleo de Apoio à Aprendizagem',
    proximaRevisao: REVISAO_PADRAO,
    historico: [], comentario: null, comentarioAMI: null, anexos: [], sintese: null,
    respostas: [], aee: { frequenta: false, resposta: respostaAEEVazia() },
    documentos: { estudo: null, pei: null, relatorio: null }
  };
}

// fichas de um professor específico (cobre tanto regência quanto disciplina)
function fichaDoProfessor(aluno, nomeProfessor) {
  return aluno.respostas.find(r => r.professor === nomeProfessor) || null;
}
function alunosDoProfessor(alunos, perfil) {
  return alunos.filter(a => fichaDoProfessor(a, perfil.nome));
}

// itens mais críticos / mais consolidados do perfil consolidado
function itensPorNivel(niveis, filtro) {
  return ITENS.filter(i => filtro(niveis[i.id])).sort((a, b) => niveis[b.id] - niveis[a.id]);
}

// onde as fichas discordam entre si — o ganho real de agregar
function divergencias(aluno) {
  const envs = enviadas(aluno);
  if (envs.length < 2) return [];
  return ITENS.map(i => {
    const vals = envs.map(r => ({ area: r.area, v: r.niveis[i.id] })).sort((a, b) => a.v - b.v);
    return {
      item: i.id, rotulo: i.rotulo, bloco: i.bloco,
      amplitude: vals[vals.length - 1].v - vals[0].v,
      melhor: vals[0].area, pior: vals[vals.length - 1].area
    };
  }).filter(d => d.amplitude >= 2).sort((a, b) => b.amplitude - a.amplitude);
}

// manifestações relatadas por qualquer professor
function manifestacoesRelatadas(aluno) {
  const envs = enviadas(aluno);
  return MANIFESTACOES.map(m => {
    const relatos = envs.filter(r => r.manifestacoes[m.id] && r.manifestacoes[m.id].sim)
      .map(r => ({ area: r.area, professor: r.professor, texto: r.manifestacoes[m.id].texto }));
    return { ...m, relatos };
  }).filter(m => m.relatos.length);
}

/* ═══════════════════════════════════════════════════════════════════
   3. GERAÇÃO DOS DOCUMENTOS
      Composição 100% local a partir das fichas estruturadas. Os níveis
      1–5 viram linguagem qualitativa — números crus não entram no texto.

      Convenção de marcação (os dois documentos usam a mesma, e por isso
      continuam editáveis como texto puro):
        "## Título"  → seção      "- item"  → tópico      resto → parágrafo
   ═══════════════════════════════════════════════════════════════ */

const OBJETIVO_ITEM = {

};

/* Alguns itens do formulário descrevem competências ("Interpretação de texto") e
   outros descrevem problemas ("Agressividade verbal ou física"). Nível baixo
   significa coisas opostas nos dois casos, então a redação precisa separá-los. */
function fraseDePontosFortes(fortes, nome) {
  const comp = fortes.filter(i => !i.neg).slice(0, 4);
  const prob = fortes.filter(i => i.neg).slice(0, 4);
  const partes = [];
  if (comp.length) partes.push(`${nome} apresenta desempenho preservado em ${listar(comp.map(i => minusculo(i.rotulo)))}`);
  if (prob.length) {
    partes.push(partes.length
      ? `e não apresenta sinais relevantes de ${listar(prob.map(i => minusculo(i.rotulo)))}`
      : `Não se observam, em ${nome}, sinais relevantes de ${listar(prob.map(i => minusculo(i.rotulo)))}`);
  }
  return partes.join(' ') + '.';
}

function agrupar(niveis) {
  return {
    fortes: itensPorNivel(niveis, v => v <= 2),
    medianas: itensPorNivel(niveis, v => v === 3),
    prioritarias: itensPorNivel(niveis, v => v >= 4),
    criticas: itensPorNivel(niveis, v => v === 5)
  };
}

// leitura qualitativa de um bloco a partir do nível predominante
function lerBloco(v) {
  if (v <= 1.7) return 'sem dificuldades observáveis';
  if (v <= 2.4) return 'com dificuldades leves, que exigem apoios pontuais';
  if (v <= 3.4) return 'com dificuldades moderadas, que exigem mediação regular';
  if (v <= 4.3) return 'com dificuldades significativas, que exigem apoio frequente';
  return 'com dificuldades acentuadas, que exigem apoio contínuo';
}

function gerarEstudoDeCaso(aluno) {
  /* ─────────────────────────────────────────────────────────────────
     ▸ PONTO DE INTEGRAÇÃO COM IA (produção)
       Nesta demonstração o documento é composto localmente pelas regras
       abaixo, sem nenhuma chamada de rede. Em produção é exatamente AQUI
       que entraria a chamada real à API:

         const resposta = await fetch('/api/pei/estudo-de-caso', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({
             aluno: { nome, idade, serie, segmento, categoria },
             periodo: PERIODO_ATUAL,
             respostas: enviadas(aluno),   // uma ficha por professor/disciplina
             aee: aluno.aee,                // quando frequenta a Sala de Recursos
             historico: aluno.historico
           })
         });
         const { texto } = await resposta.json();
         return texto;

       A chave da API ficaria no backend do colégio — nunca no navegador —
       e o texto retornado continuaria passando por esta mesma tela de
       revisão e aprovação humana.
     ───────────────────────────────────────────────────────────── */

  const envs = enviadas(aluno);
  const cons = consolidar(aluno);
  if (!cons) return null;

  const n = cons.niveis;
  const { fortes, medianas, prioritarias, criticas } = agrupar(n);
  const sem = semente(aluno.id + envs.map(r => r.area + ITENS.map(i => r.niveis[i.id]).join('')).join(''));
  const fem = aluno.genero === 'f';
  const a = fem ? 'a' : 'o';
  const pn = primeiroNome(aluno.nome);
  const nec = NECESSIDADES[aluno.categoria];
  const hist = aluno.historico;
  const divs = divergencias(aluno);
  const manifs = manifestacoesRelatadas(aluno);
  const poliv = fichaPolivalente(aluno.segmento);

  const S = [];

  /* ── Identificação ── */
  S.push('## Identificação');
  S.push(`${aluno.nome}, ${aluno.idade} anos, matriculad${a} ${aluno.serieExtenso}, turma ${aluno.turma}. O acompanhamento considera ${nec.o} e integra o Plano Educacional Individualizado do colégio.`);
  S.push(`Período de referência: ${PERIODO_ATUAL}. Este estudo foi elaborado pelo ${SETOR} a partir de ${envs.length} ficha${envs.length > 1 ? 's' : ''} de observação — ${listar(envs.map(r => r.disciplina ? `${r.disciplina} (${r.professor})` : `${r.area} (${r.professor})`))}${frequentaAEE(aluno) && respostaAEE(aluno).status === 'Enviado' ? ` — e da contribuição do AEE na Sala de Recursos (${PERFIS.aee.nome})` : ''}.`);

  /* ── Histórico escolar ── */
  S.push('## Histórico escolar');
  if (hist.length) {
    const g0 = nivelGeral(hist[0].perfis);
    const g1 = nivelGeral(cons.perfis);
    const rumo = g1 < g0 - 0.3 ? 'evolução consistente' : g1 > g0 + 0.3 ? 'retrocesso que merece atenção' : 'estabilidade';
    S.push(`${aluno.nome} é acompanhad${a} pelo Plano Educacional Individualizado desde ${hist[0].periodo}, somando ${hist.length + 1} períodos registrados. O balanço do percurso indica ${rumo}.`);
    const blocoMelhor = BLOCOS.map(b => ({ b, d: hist[0].perfis[b.id] - cons.perfis[b.id] })).sort((x, y) => y.d - x.d)[0];
    if (blocoMelhor.d >= 0.4) {
      S.push(`O avanço mais expressivo aparece no ${minusculo(blocoMelhor.b.nome)}, que passou de um quadro ${lerBloco(hist[0].perfis[blocoMelhor.b.id])} para outro ${lerBloco(cons.perfis[blocoMelhor.b.id])}.`);
    }
  } else {
    S.push(`Este é o primeiro período de acompanhamento sistemático de ${pn} pelo Plano Educacional Individualizado, o que torna o presente estudo a linha de base para as comparações futuras.`);
  }

  /* ── Perfil por bloco ── */
  S.push('## Perfil observado');
  BLOCOS.forEach(b => {
    const v = cons.perfis[b.id];
    const criticosDoBloco = prioritarias.filter(i => i.bloco === b.id);
    let frase = `- ${b.nome}: quadro ${lerBloco(v)}.`;
    if (criticosDoBloco.length) {
      frase += ` Concentram as maiores demandas ${listar(criticosDoBloco.slice(0, 3).map(i => minusculo(i.rotulo)))}.`;
    } else {
      frase += ` Nenhum item deste bloco figura em nível de prioridade neste período.`;
    }
    S.push(frase);
  });

  /* ── Síntese das observações docentes ── */
  S.push('## Síntese das observações docentes');
  const convergentes = ITENS.filter(i => {
    const vals = envs.map(r => r.niveis[i.id]);
    return Math.max(...vals) === Math.min(...vals) && vals[0] >= 4;
  });

  const aberturas = [
    'A leitura cruzada das fichas mostra que ',
    'Confrontadas entre si, as observações dos professores indicam que ',
    'O cotejo das fichas enviadas revela que '
  ];
  let sintese = variar(aberturas, sem, 1);
  if (envs.length < 2) {
    sintese += `há uma única ficha para este período, o que limita a comparação entre contextos e recomenda cautela ao generalizar as observações.`;
  } else if (convergentes.length) {
    sintese += `todos os professores registram dificuldade equivalente em ${listar(convergentes.slice(0, 3).map(i => minusculo(i.rotulo)))} — o quadro se repete independentemente do contexto, o que sugere um traço estável do perfil ${fem ? 'da aluna' : 'do aluno'}.`;
  } else {
    sintese += `não há nenhum item de dificuldade elevada registrado de forma idêntica por todos os professores, o que indica um perfil sensível ao contexto de cada aula.`;
  }
  S.push(sintese);

  if (divs.length) {
    const d = divs[0];
    S.push(`As observações não são homogêneas: em ${listar(divs.slice(0, 3).map(x => minusculo(x.rotulo)))}, os registros variam de forma relevante conforme o contexto. Em "${minusculo(d.rotulo)}", o registro mais favorável vem de ${d.melhor} e o mais crítico de ${d.pior}. A diferença sugere que o desempenho responde ao formato da aula e ao tipo de demanda, e não apenas à habilidade em si — hipótese que deve orientar as estratégias do plano.`);
  } else if (envs.length >= 2) {
    S.push(`Não se observam discrepâncias relevantes entre as fichas: os registros são coerentes entre si, o que reforça a confiabilidade do perfil consolidado.`);
  }

  // dificuldade específica por disciplina (fichas do 6º ano em diante)
  const comDificuldade = envs.filter(r => r.dificuldadeDisciplina && r.dificuldadeDisciplina.tem);
  const semDificuldade = envs.filter(r => r.dificuldadeDisciplina && !r.dificuldadeDisciplina.tem);
  if (comDificuldade.length || semDificuldade.length) {
    let d = '';
    if (comDificuldade.length) d += `Registram dificuldade específica na própria disciplina: ${listar(comDificuldade.map(r => r.disciplina))}.`;
    if (semDificuldade.length) d += `${d ? ' ' : ''}Não registram dificuldade específica: ${listar(semDificuldade.map(r => r.disciplina))} — contraste útil para identificar o que sustenta o desempenho.`;
    S.push(d);
  }

  // desempenho descrito em campo aberto (ficha dos Anos Iniciais)
  if (poliv) {
    const comDesc = envs.filter(r => r.areasDesc);
    if (comDesc.length) {
      S.push('Descrição do desempenho nas áreas, conforme registro docente:');
      AREAS_DESC.forEach(ad => {
        const textos = comDesc.map(r => r.areasDesc[ad.id]).filter(t => t && t !== 'Não avaliado nesta área.');
        if (textos.length) S.push(`- ${ad.rotulo}: ${textos[0]}`);
      });
    }
  }

  S.push('Observações registradas em sala:');
  envs.filter(r => r.observacoes).forEach(r => {
    S.push(`- ${r.disciplina || r.area} · ${r.professor}: "${r.observacoes}"`);
  });

  const comentariosPorBloco = envs.flatMap(r => BLOCOS.map(b => ({
    bloco: b, resposta: r, texto: comentariosBlocoDe(r)[b.id]
  }))).filter(x => x.texto.trim());
  if (comentariosPorBloco.length) {
    S.push('Comentários docentes por bloco:');
    comentariosPorBloco.forEach(x => {
      S.push(`- ${x.bloco.nome} · ${x.resposta.disciplina || x.resposta.area} (${x.resposta.professor}): ${x.texto.trim()}`);
    });
  }

  /* ── Contribuição do AEE — entra depois das fichas docentes ── */
  if (frequentaAEE(aluno)) {
    const raee = respostaAEE(aluno);
    S.push('## Contribuição do AEE — Sala de Recursos');
    if (raee.status === 'Enviado') {
      S.push(`A equipe de Atendimento Educacional Especializado acompanha ${pn} na Sala de Recursos com frequência ${minusculo(raee.frequencia || 'informada pela equipe')}. O registro foi enviado por ${PERFIS.aee.nome} em ${formatarData(raee.enviadoEm)}.`);
      if (raee.potencialidades) S.push(`Potencialidades observadas no atendimento: ${raee.potencialidades}`);
      if (raee.objetivos) S.push(`- Objetivos trabalhados: ${raee.objetivos}`);
      if (raee.intervencoes) S.push(`- Intervenções realizadas: ${raee.intervencoes}`);
      const recursosAee = [...(raee.recursos || [])];
      if (raee.recursosOutros) recursosAee.push(raee.recursosOutros);
      if (recursosAee.length) S.push(`- Recursos utilizados: ${listar(recursosAee)}.`);
      if (raee.evolucao) S.push(`- Resposta às intervenções e evolução: ${raee.evolucao}`);
      if (raee.articulacao) S.push(`- Articulação com a sala regular: ${raee.articulacao}`);
      if (raee.orientacoes) S.push(`- Recomendações do AEE: ${raee.orientacoes}`);
      if (raee.observacoes) S.push(`Observação complementar do AEE: ${raee.observacoes}`);
    } else if (!professoresConcluiram(aluno)) {
      S.push(`O estudante frequenta a Sala de Recursos, mas a resposta do AEE ainda não foi liberada porque há ${pendentes(aluno).length} ficha${pendentes(aluno).length > 1 ? 's' : ''} docente${pendentes(aluno).length > 1 ? 's' : ''} pendente${pendentes(aluno).length > 1 ? 's' : ''}. A contribuição deverá ser incorporada após a conclusão dessa etapa.`);
    } else {
      S.push('O estudante frequenta a Sala de Recursos e as fichas docentes já foram concluídas. A resposta do AEE está pendente e deverá ser incorporada antes da validação final do caso.');
    }
  }

  if (aluno.comentarioAMI && aluno.comentarioAMI.texto) {
    S.push('## Contribuição da AMI');
    S.push(aluno.comentarioAMI.texto.trim());
    S.push(`Registro recebido de ${aluno.comentarioAMI.autor}, em ${formatarData(aluno.comentarioAMI.data)}.`);
  }

  if (aluno.anexos && aluno.anexos.length) {
    S.push('## Documentos complementares consultados');
    aluno.anexos.forEach(anexo => S.push(`- ${anexo.categoria}: ${anexo.nome}.${anexo.resumo ? ` Síntese registrada: ${anexo.resumo}` : ''}`));
  }

  /* ── Manifestações ── */
  if (manifs.length) {
    S.push('## Manifestações relatadas');
    manifs.forEach(m => {
      const rel = m.relatos.filter(r => r.texto);
      S.push(`- ${m.rotulo}: relatad${m.rotulo.endsWith('s') ? 'os' : 'o'} por ${listar(m.relatos.map(r => r.professor))}. ${rel.length ? rel.map(r => `"${r.texto}"`).join(' ') : ''}`);
    });
    S.push(`O registro dessas manifestações não constitui diagnóstico: serve para orientar a observação continuada e a articulação com os profissionais que acompanham ${fem ? 'a estudante' : 'o estudante'} fora da escola.`);
  }

  /* ── Análise ── */
  S.push('## Análise');
  let analise = '';
  if (fortes.length) {
    analise += `No perfil consolidado, ${fraseDePontosFortes(fortes, pn)}`;
  } else {
    analise += `O perfil consolidado não aponta, neste período, nenhum item plenamente preservado, o que reforça a necessidade de apoio sistemático em toda a rotina escolar.`;
  }
  if (medianas.length) analise += ` Em ${listar(medianas.slice(0, 4).map(i => minusculo(i.rotulo)))}, o desempenho é intermediário e se sustenta com mediação do professor.`;
  if (prioritarias.length) {
    analise += ` Persistem dificuldades ${criticas.length ? 'acentuadas' : 'significativas'} em ${listar(prioritarias.slice(0, 4).map(i => minusculo(i.rotulo)))}, ${prioritarias.length > 1 ? 'itens em que' : 'item em que'} a mediação individualizada é condição para a participação efetiva.`;
  } else {
    analise += ` Não se identificam itens em nível de prioridade de intervenção, o que representa avanço importante no percurso ${fem ? 'da' : 'do'} estudante.`;
  }
  S.push(analise);

  S.push('## Adaptações, acessibilidades e recursos em uso');
  const registrosAcess = envs.map(r => ({ r, a: acessibilidadesDe(r) }));
  const emAvaliacao = registrosAcess.filter(x => x.a.avaliacao.usa);
  const naRotina = registrosAcess.filter(x => x.a.rotina.usa);
  const comRecursos = registrosAcess.filter(x => x.a.recursos.usa);
  if (!emAvaliacao.length && !naRotina.length && !comRecursos.length) {
    S.push(`Nenhum professor registrou adaptação, acessibilidade ou recurso assistivo em uso neste período. Recomenda-se confirmar essa informação em conselho de classe e na devolutiva à família.`);
  } else {
    if (emAvaliacao.length) {
      emAvaliacao.forEach(({ r, a }) => S.push(`- Avaliações · ${r.disciplina || r.area} (${r.professor}): ${a.avaliacao.descricao || 'uso informado, sem detalhamento'}.`));
    } else {
      S.push('- Avaliações: nenhum apoio específico informado nas fichas recebidas.');
    }
    if (naRotina.length) {
      naRotina.forEach(({ r, a }) => S.push(`- Rotina diária · ${r.disciplina || r.area} (${r.professor}): ${a.rotina.descricao || 'uso informado, sem detalhamento'}.`));
    } else {
      S.push('- Rotina diária: nenhuma adaptação ou acessibilidade informada nas fichas recebidas.');
    }
    if (comRecursos.length) {
      comRecursos.forEach(({ r, a }) => S.push(`- Tecnologia assistiva ou recurso material · ${r.disciplina || r.area} (${r.professor}): ${textoRecursos(a.recursos)}.`));
    } else {
      S.push('- Tecnologia assistiva ou recurso material: nenhum uso informado nas fichas recebidas.');
    }
  }

  /* ── Considerações e encaminhamentos ── */
  S.push('## Considerações e encaminhamentos');
  const focos = (prioritarias.length ? prioritarias : medianas).slice(0, 3);
  if (focos.length) {
    S.push('Prioridades para o próximo ciclo:');
    focos.forEach(i => S.push(`- ${i.rotulo}: ${OBJETIVO_ITEM[i.id]}`));
  } else {
    S.push('Recomenda-se a manutenção da rotina atual, com registro sistemático das conquistas já consolidadas.');
  }
  const pends = pendentes(aluno);
  if (pends.length) {
    S.push(`Observação metodológica: ${pends.length} ficha${pends.length > 1 ? 's' : ''} — ${listar(pends.map(r => r.disciplina || r.area))} — ainda não foi${pends.length > 1 ? 'ram' : ''} enviada${pends.length > 1 ? 's' : ''}. As conclusões deste estudo devem ser revistas quando o quadro estiver completo.`);
  }
  S.push(`Este estudo de caso constitui a base do Plano Educacional Individualizado do período. Nova avaliação está prevista para ${dataPorExtenso(aluno.proximaRevisao)}, com devolutiva à família e registro no prontuário pedagógico, em articulação com ${aluno.referenciaProsa}.`);

  return S.join('\n');
}

function gerarPEI(aluno) {
  /* ▸ PONTO DE INTEGRAÇÃO COM IA — mesma observação de gerarEstudoDeCaso:
       em produção, POST /api/pei/plano entraria exatamente aqui, recebendo as
       fichas dos professores, a contribuição do AEE E o comentário do setor de psicologia. */

  const envs = enviadas(aluno);
  const cons = consolidar(aluno);
  if (!cons) return null;

  const n = cons.niveis;
  const { fortes, medianas, prioritarias } = agrupar(n);
  const fem = aluno.genero === 'f';
  const a = fem ? 'a' : 'o';
  const pn = primeiroNome(aluno.nome);
  const nec = NECESSIDADES[aluno.categoria];
  const divs = divergencias(aluno);
  const manifs = manifestacoesRelatadas(aluno);

  const S = [];

  /* O estudo de caso passa a integrar o próprio PEI. Quando já existe uma
     versão revisada pela psicologia, ela é preservada; caso contrário, a
     versão local é composta no momento da geração do plano. */
  const estudoIntegrado = aluno.documentos.estudo && aluno.documentos.estudo.texto
    ? aluno.documentos.estudo.texto.trim()
    : gerarEstudoDeCaso(aluno);
  S.push('## Parte I — Estudo de caso');
  S.push('O estudo de caso abaixo integra este Plano Educacional Individualizado e fundamenta os objetivos, apoios e estratégias definidos para o período.');
  S.push(estudoIntegrado);
  S.push('## Parte II — Plano Educacional Individualizado');

  S.push('## Identificação');
  S.push(`${aluno.nome}, ${aluno.idade} anos, matriculad${a} ${aluno.serieExtenso}, turma ${aluno.turma}. Plano elaborado pelo ${SETOR} em ${dataPorExtenso(HOJE_ISO)}, com base em ${envs.length} ficha${envs.length > 1 ? 's' : ''} de observação${frequentaAEE(aluno) && respostaAEE(aluno).status === 'Enviado' ? ' e na contribuição do AEE' : ''}, considerando ${nec.o}.`);
  S.push(`Vigência: ${PERIODO_ATUAL}, com revisão prevista para ${dataPorExtenso(aluno.proximaRevisao)}.`);

  S.push('## Perfil atual');
  BLOCOS.forEach(b => S.push(`- ${b.nome}: quadro ${lerBloco(cons.perfis[b.id])}.`));
  let perfil = '';
  if (fortes.length) perfil += fraseDePontosFortes(fortes, pn);
  if (medianas.length) perfil += ` Avança com mediação em ${listar(medianas.slice(0, 3).map(i => minusculo(i.rotulo)))}.`;
  if (prioritarias.length) perfil += ` Requer apoio contínuo em ${listar(prioritarias.slice(0, 3).map(i => minusculo(i.rotulo)))}.`;
  S.push(perfil.trim());

  /* ── Considerações do setor de psicologia — o comentário registrado pela
        psicóloga na tela do estudo de caso entra aqui, textualmente. ── */
  if (aluno.comentario && aluno.comentario.texto.trim()) {
    S.push('## Considerações do setor de psicologia');
    S.push(aluno.comentario.texto.trim());
    S.push(`Registro de ${aluno.comentario.autor}, em ${formatarData(aluno.comentario.data)}, a partir da leitura das fichas e do acompanhamento ${fem ? 'da estudante' : 'do estudante'}.`);
  }

  S.push('## Objetivos para o período');
  const alvos = (prioritarias.length ? prioritarias : medianas).slice(0, 5);
  if (alvos.length) {
    alvos.forEach(i => S.push(`- ${i.rotulo}: ${OBJETIVO_ITEM[i.id]}`));
  } else {
    S.push('- Manutenção: sustentar as conquistas consolidadas, com registro quinzenal do que já é realizado sem apoio do adulto.');
  }

  S.push('## Adaptações, acessibilidades e recursos previstos');
  const apoios = envs.map(r => ({ r, a: acessibilidadesDe(r) }));
  const apoiosAvaliacao = apoios.filter(x => x.a.avaliacao.usa);
  const apoiosRotina = apoios.filter(x => x.a.rotina.usa);
  const recursos = apoios.filter(x => x.a.recursos.usa);
  if (!apoios.some(x => temAcessibilidade(x.a))) {
    S.push('- Nenhuma adaptação, acessibilidade ou tecnologia assistiva foi registrada pelos professores. Confirmar a necessidade de apoios no conselho de classe e na escuta da família.');
  } else {
    if (apoiosAvaliacao.length) apoiosAvaliacao.forEach(({ r, a }) => S.push(`- Avaliações · ${r.disciplina || r.area} (${r.professor}): ${a.avaliacao.descricao || 'manter o apoio informado e detalhá-lo na próxima revisão'}.`));
    else S.push('- Avaliações: sem adaptação específica registrada neste período.');
    if (apoiosRotina.length) apoiosRotina.forEach(({ r, a }) => S.push(`- Rotina diária · ${r.disciplina || r.area} (${r.professor}): ${a.rotina.descricao || 'manter o apoio informado e detalhá-lo na próxima revisão'}.`));
    else S.push('- Rotina diária: sem adaptação específica registrada neste período.');
    if (recursos.length) recursos.forEach(({ r, a }) => S.push(`- Tecnologia assistiva ou recurso material · ${r.disciplina || r.area} (${r.professor}): ${textoRecursos(a.recursos)}.`));
    else S.push('- Tecnologia assistiva ou recurso material: nenhum recurso informado neste período.');
  }

  S.push('## Estratégias por professor');
  envs.forEach(r => {
    const criticoLocal = ITENS.slice().sort((x, y) => r.niveis[y.id] - r.niveis[x.id])[0];
    const acess = acessibilidadesDe(r);
    const base = r.estrategias || acess.avaliacao.descricao || acess.rotina.descricao || 'manter as práticas já em curso';
    S.push(`- ${r.disciplina || r.area} (${r.professor}): ${minusculo(base.replace(/\.$/, ''))}. Foco: ${minusculo(criticoLocal.rotulo)} — hoje em nível de ${minusculo(rotuloDesempenho(desempenho(r.niveis[criticoLocal.id])))}.`);
  });
  const pends = pendentes(aluno);
  if (pends.length) {
    S.push(`- ${listar(pends.map(r => r.disciplina || r.area))}: ficha ainda não enviada. As estratégias ser${pends.length > 1 ? 'ão' : 'á'} incorporad${pends.length > 1 ? 'as' : 'a'} na próxima revisão do plano.`);
  }

  if (frequentaAEE(aluno)) {
    const raee = respostaAEE(aluno);
    S.push('## Articulação com o AEE — Sala de Recursos');
    if (raee.status === 'Enviado') {
      S.push(`O atendimento na Sala de Recursos integra este plano e será articulado com os professores da sala regular por ${PERFIS.aee.nome}.`);
      if (raee.objetivos) S.push(`- Objetivos do AEE: ${raee.objetivos}`);
      if (raee.intervencoes) S.push(`- Intervenções especializadas: ${raee.intervencoes}`);
      const recursosAee = [...(raee.recursos || [])];
      if (raee.recursosOutros) recursosAee.push(raee.recursosOutros);
      if (recursosAee.length) S.push(`- Recursos da Sala de Recursos: ${listar(recursosAee)}.`);
      if (raee.articulacao) S.push(`- Aplicação na sala regular: ${raee.articulacao}`);
      if (raee.orientacoes) S.push(`- Orientações à equipe: ${raee.orientacoes}`);
    } else if (!professoresConcluiram(aluno)) {
      S.push('- A contribuição do AEE ainda está bloqueada até a conclusão das fichas dos professores. Regenerar o plano após o envio da equipe da Sala de Recursos.');
    } else {
      S.push('- Resposta da equipe de AEE pendente. Regenerar o plano depois que o registro da Sala de Recursos for enviado.');
    }
  }

  if (aluno.comentarioAMI && aluno.comentarioAMI.texto) {
    S.push('## Articulação com a AMI');
    S.push(aluno.comentarioAMI.texto.trim());
  }

  if (aluno.anexos && aluno.anexos.length) {
    S.push('## Documentos complementares considerados');
    aluno.anexos.forEach(anexo => S.push(`- ${anexo.categoria}: ${anexo.nome}${anexo.resumo ? ` — ${anexo.resumo}` : ' — conteúdo a ser validado pela equipe no sistema de produção'}.`));
  }

  if (divs.length) {
    const d = divs[0];
    S.push(`Nota para o conselho: o desempenho em "${minusculo(d.rotulo)}" varia conforme o contexto — melhor em ${d.melhor}, mais crítico em ${d.pior}. Recomenda-se investigar o que ${d.melhor} faz de diferente e replicar a condição nas demais aulas.`);
  }

  if (manifs.length) {
    S.push('## Manifestações a acompanhar');
    manifs.forEach(m => S.push(`- ${m.rotulo}: ${m.relatos.filter(r => r.texto).map(r => r.texto).join(' ') || `relatado por ${listar(m.relatos.map(r => r.professor))}.`}`));
  }

  S.push('## Avaliação e revisão');
  S.push(`O alcance dos objetivos será verificado pelo registro de cada professor, com nova ficha de observação ao final do período. A revisão deste plano ocorrerá em ${dataPorExtenso(aluno.proximaRevisao)}, em reunião do ${SETOR} com ${aluno.referenciaProsa} e os professores envolvidos, seguida de devolutiva à família.`);
  S.push('Considera-se objetivo alcançado quando o comportamento descrito for observado de forma consistente por, ao menos, dois professores distintos.');

  return S.join('\n');
}

function gerarRelatorioAcompanhamento(aluno) {
  /* Relatório composto apenas com as respostas docentes. Em produção, uma
     chamada real à API entraria aqui, substituindo a composição local abaixo. */
  const envs = enviadas(aluno);
  const cons = consolidar(aluno);
  if (!envs.length || !cons) return null;
  const fem = aluno.genero === 'f';
  const pn = primeiroNome(aluno.nome);
  const S = [];

  S.push('## Identificação e finalidade');
  S.push(`${aluno.nome}, ${aluno.idade} anos, matriculad${fem ? 'a' : 'o'} ${aluno.serieExtenso}, turma ${aluno.turma}. Este relatório registra o acompanhamento escolar de ${PERIODO_ATUAL} a partir das observações dos professores, preservando as diferenças entre disciplinas e contextos.`);
  S.push(`Foram consideradas ${envs.length} ficha${envs.length > 1 ? 's' : ''}: ${listar(envs.map(r => `${r.disciplina || r.area} — ${r.professor}`))}.`);

  S.push('## Acompanhamento por contexto');
  envs.forEach(r => {
    const locais = perfisDe(r.niveis);
    const faixas = BLOCOS.map(b => `${minusculo(b.curto)} em ${minusculo(rotuloDesempenho(desempenho(locais[b.id])))}`);
    S.push(`- ${r.disciplina || r.area} (${r.professor}): ${listar(faixas)}.${r.observacoes ? ` Observação: ${r.observacoes}` : ''}`);
    BLOCOS.forEach(b => {
      const comentario = comentariosBlocoDe(r)[b.id];
      if (comentario) S.push(`- Comentário de ${minusculo(b.nome)} · ${r.disciplina || r.area}: ${comentario}`);
    });
  });

  S.push('## Leitura das respostas');
  BLOCOS.forEach(b => S.push(`- ${b.nome}: a faixa predominante nas fichas é ${minusculo(rotuloDesempenho(desempenho(cons.perfis[b.id])))}.`));
  const divs = divergencias(aluno);
  if (divs.length) {
    S.push(`As respostas variam conforme o contexto em ${listar(divs.slice(0, 4).map(d => minusculo(d.rotulo)))}. Essa diferença é mantida no relatório e deve ser discutida pela equipe, sem transformar as fichas em uma média única.`);
  } else {
    S.push('As respostas apresentam convergência entre os contextos observados, sem diferenças acentuadas entre as fichas recebidas.');
  }

  const apoios = envs.map(r => ({ r, a: acessibilidadesDe(r) })).filter(x => temAcessibilidade(x.a));
  S.push('## Apoios observados na rotina escolar');
  if (!apoios.length) {
    S.push('Não há adaptação, acessibilidade ou recurso material registrado nas fichas deste período.');
  } else {
    apoios.forEach(({ r, a }) => {
      if (a.avaliacao.usa) S.push(`- Avaliações · ${r.disciplina || r.area}: ${a.avaliacao.descricao || 'apoio informado, sem detalhamento'}.`);
      if (a.rotina.usa) S.push(`- Rotina diária · ${r.disciplina || r.area}: ${a.rotina.descricao || 'apoio informado, sem detalhamento'}.`);
      if (a.recursos.usa) S.push(`- Recurso assistivo ou material · ${r.disciplina || r.area}: ${textoRecursos(a.recursos)}.`);
    });
  }

  S.push('## Encaminhamentos para o próximo período');
  const prioritarios = itensPorNivel(cons.niveis, v => v >= 4).slice(0, 4);
  if (prioritarios.length) S.push(`A equipe docente deverá acompanhar especialmente ${listar(prioritarios.map(i => minusculo(i.rotulo)))}, registrando exemplos concretos de avanço, estabilidade ou necessidade de novo apoio.`);
  else S.push(`Recomenda-se manter as estratégias que favorecem a participação de ${pn} e registrar, por contexto, as conquistas que se tornam mais autônomas.`);
  S.push(`O presente relatório tem finalidade de acompanhamento escolar e deverá ser revisto em ${dataPorExtenso(aluno.proximaRevisao)}.`);
  return S.join('\n');
}

function gerarSinteseCompleta(aluno) {
  /* Síntese integrada local. Em produção, a leitura segura dos anexos e a
     chamada real à API entrariam exatamente neste ponto, em um backend. */
  const envs = enviadas(aluno);
  const cons = consolidar(aluno);
  if (!cons) return null;
  const S = [];
  const fem = aluno.genero === 'f';

  S.push('## Identificação e fontes consideradas');
  S.push(`${aluno.nome}, ${aluno.idade} anos, ${aluno.turma}, em acompanhamento no período ${PERIODO_ATUAL}. A síntese reúne as fichas docentes, os comentários de cada bloco, as adaptações registradas, a contribuição do AEE quando aplicável, os registros da AMI e da psicologia e os documentos complementares anexados.`);
  S.push(`Fontes docentes: ${listar(envs.map(r => `${r.disciplina || r.area} (${r.professor})`))}.`);

  S.push('## Síntese das respostas docentes');
  BLOCOS.forEach(b => {
    S.push(`- ${b.nome}: faixa predominante ${minusculo(rotuloDesempenho(desempenho(cons.perfis[b.id])))}; ${lerBloco(cons.perfis[b.id])}.`);
    envs.forEach(r => {
      const comentario = comentariosBlocoDe(r)[b.id];
      if (comentario) S.push(`- ${r.disciplina || r.area} · ${r.professor}: ${comentario}`);
    });
  });
  const divs = divergencias(aluno);
  if (divs.length) S.push(`Foram preservadas diferenças relevantes entre contextos em ${listar(divs.slice(0, 4).map(d => minusculo(d.rotulo)))}; elas não foram reduzidas a uma média.`);

  S.push('## Adaptações, acessibilidades e manifestações');
  const apoios = envs.map(r => ({ r, a: acessibilidadesDe(r) })).filter(x => temAcessibilidade(x.a));
  if (apoios.length) {
    apoios.forEach(({ r, a }) => {
      const partes = [];
      if (a.avaliacao.usa) partes.push(`avaliações: ${a.avaliacao.descricao || 'uso informado'}`);
      if (a.rotina.usa) partes.push(`rotina: ${a.rotina.descricao || 'uso informado'}`);
      if (a.recursos.usa) partes.push(`recursos: ${textoRecursos(a.recursos)}`);
      S.push(`- ${r.disciplina || r.area}: ${partes.join('; ')}.`);
    });
  } else S.push('Nenhum apoio específico foi informado nas fichas recebidas.');
  const manifs = manifestacoesRelatadas(aluno);
  manifs.forEach(m => S.push(`- ${m.rotulo}: ${listar(m.relatos.map(r => r.texto || `observado por ${r.professor}`))}.`));

  S.push('## Contribuições interdisciplinares');
  if (frequentaAEE(aluno)) {
    const aee = respostaAEE(aluno);
    S.push(aee.status === 'Enviado'
      ? `AEE: ${aee.evolucao || aee.observacoes || 'resposta enviada pela Sala de Recursos'}, com foco em ${aee.objetivos || 'objetivos definidos pela equipe'}.`
      : 'AEE: estudante vinculado à Sala de Recursos, com resposta ainda pendente.');
  } else S.push('AEE: o estudante não está marcado como frequentando a Sala de Recursos neste ciclo.');
  S.push(aluno.comentarioAMI && aluno.comentarioAMI.texto ? `AMI: ${aluno.comentarioAMI.texto}` : 'AMI: nenhum comentário recebido neste período.');
  S.push(aluno.comentario && aluno.comentario.texto ? `Psicologia: ${aluno.comentario.texto}` : 'Psicologia: consideração complementar ainda não registrada.');

  S.push('## Documentos complementares');
  if (aluno.anexos && aluno.anexos.length) aluno.anexos.forEach(anexo => S.push(`- ${anexo.categoria} · ${anexo.nome}${anexo.resumo ? `: ${anexo.resumo}` : ' — conteúdo não interpretado nesta demonstração'}.`));
  else S.push('Nenhum laudo ou avaliação foi anexado neste período.');

  S.push('## Síntese integradora');
  const prioritarios = itensPorNivel(cons.niveis, v => v >= 4).slice(0, 4);
  S.push(`${fem ? 'A estudante' : 'O estudante'} apresenta um perfil que responde de forma distinta aos contextos de ensino. ${prioritarios.length ? `As prioridades compartilhadas são ${listar(prioritarios.map(i => minusculo(i.rotulo)))}.` : 'Não há item em faixa de prioridade compartilhada neste período.'} As decisões do estudo de caso e do PEI deverão considerar cada fonte separadamente, validar os apoios com a família e registrar a resposta do estudante às estratégias propostas.`);
  return S.join('\n');
}

/* ── Leitura automática da tendência histórica ─────────────────── */
function analisarTendencia(aluno) {
  const regs = periodos(aluno);
  if (regs.length < 2) {
    return ['Há apenas um período registrado até o momento — a leitura de tendência estará disponível a partir do próximo ciclo de avaliação.'];
  }
  const pri = regs[0].perfis;
  const ult = regs[regs.length - 1].perfis;
  const frases = [];

  BLOCOS.forEach(b => {
    const serie = regs.map(r => r.perfis[b.id]);
    const delta = ult[b.id] - pri[b.id];
    const monotona = serie.every((v, i) => i === 0 || v <= serie[i - 1] + 0.05);
    if (delta <= -0.8 && monotona) frases.push(`Evolução consistente no ${minusculo(b.nome)}: o desempenho subiu período após período, sem retrocessos ao longo dos ${regs.length} registros.`);
    else if (delta <= -0.3) frases.push(`Avanço no ${minusculo(b.nome)}${monotona ? '' : ', ainda que com oscilação entre os períodos intermediários'}.`);
    else if (delta >= 0.3) frases.push(`Requer atenção: o ${minusculo(b.nome)} apresenta queda de desempenho em relação a ${regs[0].periodo}.`);
    else frases.push(`Estabilidade no ${minusculo(b.nome)}, que se mantém no mesmo patamar desde ${regs[0].periodo}.`);
  });

  const d0 = desempenho(nivelGeral(pri));
  const d1 = desempenho(nivelGeral(ult));
  const dif = Math.abs(d1 - d0);
  const dir = d1 > d0 ? 'alta' : d1 < d0 ? 'recuo' : null;
  frases.push(`No conjunto dos três perfis, a faixa predominante de desempenho passou de ${rotuloDesempenho(d0)} para ${rotuloDesempenho(d1)} — ${dir ? `${dir} de ${dif} faixa${dif > 1 ? 's' : ''} no balanço geral` : 'sem mudança de faixa no balanço geral'}.`);
  return frases;
}

/* ── Renderizador dos documentos ────────────────────────────────── */
function CorpoDocumento({ texto, justificado }) {
  const blocos = [];
  texto.split('\n').forEach(linha => {
    const l = linha.trim();
    if (!l) return;
    if (l.startsWith('## ')) blocos.push({ t: 'h', v: l.slice(3) });
    else if (l.startsWith('- ')) {
      const ult = blocos[blocos.length - 1];
      if (ult && ult.t === 'ul') ult.v.push(l.slice(2));
      else blocos.push({ t: 'ul', v: [l.slice(2)] });
    } else blocos.push({ t: 'p', v: l });
  });

  return (
    <div className={`documento ${justificado ? 'documento-justificado' : ''}`}>
      {blocos.map((b, i) => {
        if (b.t === 'h') {
          return (
            <h3 key={i} className={`font-sans text-[11px] font-semibold uppercase tracking-[0.16em] text-pei-600 border-b border-pei-100 pb-2 ${i === 0 ? '' : 'mt-9'} mb-4`}>{b.v}</h3>
          );
        }
        if (b.t === 'ul') {
          return (
            <ul key={i} className="mt-3 space-y-2.5">
              {b.v.map((item, j) => {
                const sep = item.indexOf(': ');
                const rotulo = sep > 0 && sep < 70 ? item.slice(0, sep) : null;
                return (
                  <li key={j} className="flex gap-3">
                    <span className="mt-[9px] h-1.5 w-1.5 rounded-full bg-pei-300 shrink-0" />
                    <span className="flex-1">
                      {rotulo ? <><strong className="font-semibold text-tinta-900">{rotulo}:</strong>{item.slice(sep + 1)}</> : item}
                    </span>
                  </li>
                );
              })}
            </ul>
          );
        }
        return <p key={i}>{b.v}</p>;
      })}
    </div>
  );
}

   ═══════════════════════════════════════════════════════════════ */

function GraficoReserva({ dados, series }) {
  const L = 760, A = 320, ml = 118, mr = 18, mt = 16, mb = 42;
  const li = L - ml - mr, ai = A - mt - mb;
  const n = dados.length;
  const px = i => ml + (n === 1 ? li / 2 : (li * i) / (n - 1));
  const py = v => mt + ai - ((v - 1) / 4) * ai;
  return (
    <svg viewBox={`0 0 ${L} ${A}`} className="w-full" style={{ height: 340 }} role="img" aria-label="Evolução do desempenho por perfil">
      {[1, 2, 3, 4, 5].map(v => (
        <g key={v}>
          <line x1={ml} x2={L - mr} y1={py(v)} y2={py(v)} stroke="#dbe6e8" strokeDasharray="3 4" />
          <text x={ml - 12} y={py(v) + 4} textAnchor="end" fontSize="11.5" fill="#6b7f86">{ROTULO_DESEMPENHO[v]}</text>
        </g>
      ))}
      {dados.map((d, i) => <text key={d.periodo} x={px(i)} y={A - 14} textAnchor="middle" fontSize="12" fill="#6b7f86">{d.periodo}</text>)}
      {series.map(s => (
        <g key={s}>
          <polyline fill="none" stroke={COR_BLOCO[s]} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"
            points={dados.map((d, i) => `${px(i)},${py(d[s])}`).join(' ')} />
          {dados.map((d, i) => (
            <circle key={i} cx={px(i)} cy={py(d[s])} r="4.5" fill="#fff" stroke={COR_BLOCO[s]} strokeWidth="2.5">
              <title>{`${CURTO_BLOCO[s]} — ${d.periodo}: ${rotuloDesempenho(d[s])}`}</title>
            </circle>
          ))}
        </g>
      ))}
    </svg>
  );
}

function GraficoEvolucao({ dados, series }) {
  const R = typeof window !== 'undefined' ? window.Recharts : null;
  if (!R || !R.LineChart) return <GraficoReserva dados={dados} series={series} />;
  const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip } = R;
  return (
    <ResponsiveContainer width="100%" height={340}>
      <LineChart data={dados} margin={{ top: 12, right: 24, left: 0, bottom: 8 }}>
        <CartesianGrid strokeDasharray="3 5" stroke="#e4e7ec" vertical={false} />
        <XAxis dataKey="periodo" tick={{ fontSize: 12, fill: '#667085' }} axisLine={{ stroke: '#d0d5dd' }}
          tickLine={false} dy={8} interval={0} padding={{ left: 34, right: 34 }} />
        <YAxis domain={[1, 5]} ticks={[1, 2, 3, 4, 5]} tick={{ fontSize: 11.5, fill: '#667085' }}
          axisLine={false} tickLine={false} width={134} tickFormatter={v => ROTULO_DESEMPENHO[v]} />
        <Tooltip
          cursor={{ stroke: '#aeb5ff', strokeWidth: 1, strokeDasharray: '4 4' }}
          contentStyle={{ borderRadius: 14, border: '1px solid #d0d5dd', boxShadow: '0 18px 38px -22px rgba(16,24,40,.45)', fontSize: 12, fontFamily: 'Manrope, sans-serif', padding: '10px 12px' }}
          labelStyle={{ color: '#111827', fontWeight: 700, marginBottom: 6 }}
          formatter={(v, nome) => [rotuloDesempenho(v), CURTO_BLOCO[nome] || nome]}
        />
        {series.map(s => (
          <Line key={s} type="monotone" dataKey={s} stroke={COR_BLOCO[s]} strokeWidth={2.5}
            dot={{ r: 4, strokeWidth: 2.5, fill: '#fff' }} activeDot={{ r: 6, strokeWidth: 2.5, fill: '#fff' }} animationDuration={650} />
        ))}
      </LineChart>
    </ResponsiveContainer>
  );
}

      ? valor.recursos.itens.filter(x => x !== item)

  return (
