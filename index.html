function Filtro({ rotulo, opcoes, valor, aoMudar }) {
  return (
    <div className="flex flex-wrap items-center gap-2">
      <span className="text-[12px] text-tinta-400 mr-0.5">{rotulo}</span>
      <div className="inline-flex flex-wrap rounded-xl bg-white p-1 ring-1 ring-pei-200 shadow-suave">
        {opcoes.map(o => (
          <button key={o} onClick={() => aoMudar(o)}
            className={`rounded-lg px-3 py-1.5 text-[12.5px] font-medium transition-all duration-200 ${
              valor === o ? 'bg-pei-700 text-white shadow-suave' : 'text-tinta-600 hover:bg-pei-50 hover:text-pei-700'
            }`}>{o}</button>
        ))}
      </div>
    </div>
  );
}

function CartaoResposta({ resposta }) {
  const [bloco, setBloco] = useState('cognitivo');
  const enviada = resposta.status === 'Enviado';
  const perfis = enviada ? perfisDe(resposta.niveis) : null;
  const manifestacoes = normalizarManifestacoes(resposta.manifestacoes);
  const comentarios = comentariosBlocoDe(resposta);
  const manifs = enviada ? MANIFESTACOES.filter(m => manifestacoes[m.id].sim) : [];
  const acess = acessibilidadesDe(resposta);

  return (
    <div className={`rounded-xl px-4 py-4 ring-1 ring-inset ${enviada ? 'bg-white ring-pei-200' : 'bg-pei-50/40 ring-pei-100'}`}>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div className="min-w-0">
          <p className="text-[13.5px] font-medium text-tinta-900">{resposta.disciplina || resposta.area}</p>
          <p className="text-[12px] text-tinta-500 mt-0.5">{resposta.professor}</p>
        </div>
        <div className="flex items-center gap-2">
          {enviada && <span className="text-[11.5px] text-tinta-400">{formatarData(resposta.enviadoEm)}</span>}
          <Selo status={resposta.status} tamanho="sm" />
        </div>
      </div>

      {!enviada ? (
        <p className="text-[12.5px] text-tinta-400 leading-relaxed">
          Ficha ainda não enviada por {resposta.professor}. O perfil consolidado é calculado sem esta ficha.
        </p>
      ) : (
        <>
          {resposta.dificuldadeDisciplina && (
            <div className={`mb-3 rounded-lg px-3 py-2 text-[12.5px] leading-relaxed ring-1 ring-inset ${
              resposta.dificuldadeDisciplina.tem ? 'bg-telha-50 text-telha-600 ring-telha-200' : 'bg-sabia-50 text-sabia-700 ring-sabia-200'
            }`}>
              <strong className="font-semibold">{resposta.dificuldadeDisciplina.tem ? 'Com dificuldade na disciplina.' : 'Sem dificuldade na disciplina.'}</strong>
              {resposta.dificuldadeDisciplina.texto ? ` ${resposta.dificuldadeDisciplina.texto}` : ''}
            </div>
          )}

          <PerfilBlocos perfis={perfis} compacto />

          <div className="mt-3.5 pt-3.5 border-t border-pei-100">
            <div className="inline-flex rounded-lg bg-pei-50 p-0.5 ring-1 ring-pei-100 mb-2.5">
              {BLOCOS.map(b => (
                <button key={b.id} onClick={() => setBloco(b.id)}
                  className={`rounded-md px-2.5 py-1 text-[11.5px] font-medium transition ${bloco === b.id ? 'bg-white text-tinta-800 shadow-suave' : 'text-tinta-500 hover:text-tinta-700'}`}>
                  {b.curto}
                </button>
              ))}
            </div>
            <ItensDoBloco bloco={bloco} niveis={resposta.niveis} destaque />
            {comentarios[bloco] && (
              <div className="mt-3 rounded-xl bg-pei-50/70 px-3.5 py-3 ring-1 ring-inset ring-pei-100">
                <p className="text-[10.5px] font-semibold uppercase tracking-[0.11em] text-pei-600">Comentário do professor sobre este bloco</p>
                <p className="mt-1.5 text-[12.5px] leading-relaxed text-tinta-600">{comentarios[bloco]}</p>
              </div>
            )}
          </div>

          {resposta.areasDesc && (
            <div className="mt-3.5 pt-3.5 border-t border-pei-100 space-y-2">
              <p className="text-[11px] font-semibold uppercase tracking-[0.12em] text-tinta-400">Desempenho nas áreas</p>
              {AREAS_DESC.filter(ad => resposta.areasDesc[ad.id]).map(ad => (
                <p key={ad.id} className="text-[12.5px] text-tinta-600 leading-relaxed">
                  <strong className="font-medium text-tinta-800">{ad.rotulo}:</strong> {resposta.areasDesc[ad.id]}
                </p>
              ))}
            </div>
          )}

          {manifs.length > 0 && (
            <div className="mt-3.5 pt-3.5 border-t border-pei-100">
              <p className="text-[11px] font-semibold uppercase tracking-[0.12em] text-tinta-400 mb-2">Manifestações relatadas</p>
              <div className="space-y-2">
                {manifs.map(m => (
                  <div key={m.id} className="rounded-lg bg-lilas-50 ring-1 ring-inset ring-lilas-200 px-3 py-2">
                    <p className="text-[12.5px] font-medium text-lilas-600">{m.rotulo}</p>
                    {manifestacoes[m.id].texto && <p className="text-[12px] text-tinta-600 leading-relaxed mt-1">{manifestacoes[m.id].texto}</p>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {resposta.observacoes && (
            <p className="text-[12.5px] text-tinta-600 leading-relaxed mt-3.5 italic border-l-2 border-pei-200 pl-3">“{resposta.observacoes}”</p>
          )}

          <div className="mt-3.5 pt-3.5 border-t border-pei-100 space-y-2 text-[12.5px] text-tinta-600 leading-relaxed">
            <p className="text-[11px] font-semibold uppercase tracking-[0.12em] text-tinta-400">Adaptações, acessibilidades e recursos</p>
            {acess.avaliacao.usa && <p><strong className="font-medium text-tinta-800">Avaliações:</strong> {acess.avaliacao.descricao || 'Uso informado, sem detalhamento.'}</p>}
            {acess.rotina.usa && <p><strong className="font-medium text-tinta-800">Rotina diária:</strong> {acess.rotina.descricao || 'Uso informado, sem detalhamento.'}</p>}
            {acess.recursos.usa && <p><strong className="font-medium text-tinta-800">Tecnologia assistiva ou recurso material:</strong> {textoRecursos(acess.recursos)}.</p>}
            {!temAcessibilidade(acess) && <p className="text-tinta-400">Nenhum apoio específico informado nesta ficha.</p>}
            {resposta.estrategias && <p><strong className="font-medium text-tinta-800">Estratégias:</strong> {resposta.estrategias}</p>}
          </div>

          {resposta.outras && (
            <p className="text-[12px] text-tinta-500 leading-relaxed mt-3 pt-3 border-t border-pei-100">
              <strong className="font-medium text-tinta-700">Outras informações:</strong> {resposta.outras}
            </p>
          )}
        </>
      )}
    </div>
  );
}

function CartaoRespostaAEE({ aluno }) {
  if (!frequentaAEE(aluno)) return null;
  const r = respostaAEE(aluno);
  const status = statusFluxoAEE(aluno);
  const recursos = [...(r.recursos || [])];
  if (r.recursosOutros) recursos.push(r.recursosOutros);

  return (
    <div className="mt-4 rounded-2xl bg-gradient-to-br from-lilas-50/90 to-white p-5 ring-1 ring-inset ring-lilas-200">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="flex items-start gap-3">
          <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-lilas-100 text-lilas-600"><Icone nome="faisca" className="h-5 w-5" /></span>
          <div>
            <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-lilas-600">Contribuição posterior às fichas docentes</p>
            <h4 className="mt-1 font-serif text-[17px] font-semibold text-tinta-900">AEE · Sala de Recursos</h4>
            <p className="mt-0.5 text-[12px] text-tinta-500">{PERFIS.aee.nome}</p>
          </div>
        </div>
        <Selo status={status} tamanho="sm" />
      </div>

      {status === 'Aguardando professores' ? (
        <p className="mt-4 rounded-xl bg-ambar-50 px-4 py-3 text-[12.5px] leading-relaxed text-ambar-600 ring-1 ring-inset ring-ambar-200">
          O estudante frequenta a Sala de Recursos, mas o formulário do AEE permanece bloqueado até a chegada de {pendentes(aluno).length} {pendentes(aluno).length === 1 ? 'ficha docente' : 'fichas docentes'}.
        </p>
      ) : r.status === 'Pendente' ? (
        <p className="mt-4 text-[12.5px] leading-relaxed text-tinta-500">As fichas dos professores foram concluídas. A resposta da equipe de AEE está liberada e ainda não foi enviada.</p>
      ) : (
        <div className="mt-4 grid gap-4 md:grid-cols-2">
          {[
            ['Frequência', r.frequencia],
            ['Potencialidades observadas', r.potencialidades],
            ['Objetivos trabalhados', r.objetivos],
            ['Intervenções realizadas', r.intervencoes],
            ['Recursos utilizados', recursos.length ? listar(recursos) : 'Nenhum recurso específico informado'],
            ['Resposta às intervenções e evolução', r.evolucao],
            ['Articulação com a sala regular', r.articulacao],
            ['Orientações e próximos passos', r.orientacoes]
          ].filter(([, valor]) => valor).map(([rotulo, valor]) => (
            <div key={rotulo} className="rounded-xl bg-white/80 p-3.5 ring-1 ring-inset ring-lilas-100">
              <p className="text-[10.5px] font-semibold uppercase tracking-[0.11em] text-tinta-400">{rotulo}</p>
              <p className="mt-1.5 text-[12.5px] leading-relaxed text-tinta-600">{valor}</p>
            </div>
          ))}
          {r.observacoes && <p className="md:col-span-2 border-l-2 border-lilas-300 pl-3 text-[12.5px] italic leading-relaxed text-tinta-600">“{r.observacoes}”</p>}
          <p className="md:col-span-2 text-[11px] text-tinta-400">Resposta enviada em {formatarData(r.enviadoEm)}.</p>
        </div>
      )}
    </div>
  );
}

function PainelFontesESintese({ aluno, aoAnexar, aoSalvarAMI, aoGerarSintese, aoEditarSintese }) {
  const [ami, setAmi] = useState(aluno.comentarioAMI ? aluno.comentarioAMI.texto : '');
  const [editandoSintese, setEditandoSintese] = useState(false);
  useEffect(() => {
    setAmi(aluno.comentarioAMI ? aluno.comentarioAMI.texto : '');
    setEditandoSintese(false);
  }, [aluno.id]);

  const amiMudou = ami.trim() !== (aluno.comentarioAMI ? aluno.comentarioAMI.texto.trim() : '');
  const anexos = aluno.anexos || [];
  const tipos = [
    { categoria: 'Laudo', icone: 'caixa', ajuda: 'Laudo clínico ou documento de referência' },
    { categoria: 'Avaliação', icone: 'ficha', ajuda: 'Avaliação psicológica ou psicopedagógica' }
  ];

  return (
    <div className="mt-4 grid gap-4 xl:grid-cols-[minmax(0,.9fr)_minmax(0,1.1fr)]">
      <div className="space-y-4">
        <div className="rounded-2xl bg-white p-5 ring-1 ring-inset ring-pei-200">
          <div className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Documentos do setor de psicologia</p>
              <h4 className="mt-1 font-serif text-[17px] font-semibold text-tinta-900">Laudos e avaliações</h4>
              <p className="mt-1 text-[12px] leading-relaxed text-tinta-500">Anexe as fontes complementares do caso.</p>
            </div>
            <Etiqueta tom={anexos.length ? 'sabia' : 'neutro'}>{anexos.length} {anexos.length === 1 ? 'arquivo' : 'arquivos'}</Etiqueta>
          </div>

          <div className="mt-4 grid gap-2 sm:grid-cols-2">
            {tipos.map(tipo => (
              <label key={tipo.categoria} className="cursor-pointer rounded-xl border border-dashed border-pei-300 bg-pei-50/50 px-4 py-3 transition hover:border-pei-500 hover:bg-pei-50">
                <input type="file" accept=".pdf,.doc,.docx,image/*" className="sr-only" onChange={e => {
                  const arquivo = e.target.files && e.target.files[0];
                  if (arquivo) aoAnexar(aluno.id, tipo.categoria, arquivo);
                  e.target.value = '';
                }} />
                <span className="flex items-center gap-2 text-[12.5px] font-semibold text-pei-700"><Icone nome={tipo.icone} className="h-4 w-4" />Anexar {tipo.categoria.toLowerCase()}</span>
                <span className="mt-1 block text-[10.5px] leading-snug text-tinta-400">{tipo.ajuda}</span>
              </label>
            ))}
          </div>

          {anexos.length ? (
            <ul className="mt-4 space-y-2">
              {anexos.map(anexo => (
                <li key={anexo.id} className="flex items-start gap-3 rounded-xl bg-slate-50 px-3.5 py-3 ring-1 ring-inset ring-slate-200">
                  <span className="mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-pei-600 ring-1 ring-slate-200"><Icone nome="caixa" className="h-4 w-4" /></span>
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-[12.5px] font-medium text-tinta-800">{anexo.nome}</p>
                    <p className="mt-0.5 text-[10.5px] text-tinta-400">{anexo.categoria} · {anexo.tamanho} · {formatarData(anexo.adicionadoEm)}</p>
                  </div>
                </li>
              ))}
            </ul>
          ) : <p className="mt-4 rounded-xl bg-slate-50 px-3.5 py-3 text-[11.5px] text-tinta-400">Nenhum documento complementar anexado.</p>}

          <p className="mt-3 text-[10.5px] leading-relaxed text-tinta-400">Nesta demonstração, o arquivo fica apenas em memória e a síntese registra seu nome e tipo. Em produção, o conteúdo seria processado com segurança no servidor.</p>
        </div>

        <div className="rounded-2xl bg-lilas-50/60 p-5 ring-1 ring-inset ring-lilas-200">
          <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-lilas-600">Contribuição recebida</p>
          <h4 className="mt-1 font-serif text-[17px] font-semibold text-tinta-900">Comentário da AMI</h4>
          <textarea value={ami} maxLength={2200} rows={5} onChange={e => setAmi(e.target.value)}
            placeholder="Registre a contribuição recebida da AMI e complemente com as observações necessárias."
            className="mt-3 w-full resize-y rounded-xl border-0 bg-white px-4 py-3 text-[13px] leading-relaxed text-tinta-800 ring-1 ring-inset ring-lilas-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-lilas-400 outline-none" />
          <div className="mt-2.5 flex flex-wrap items-center justify-between gap-2">
            <span className="text-[10.5px] tabular-nums text-tinta-400">{ami.length}/2.200 caracteres</span>
            <Botao variante="secundario" className="px-3.5 py-2 text-[12.5px]" disabled={!amiMudou} onClick={() => aoSalvarAMI(aluno.id, ami)}>
              <Icone nome="check" className="h-3.5 w-3.5" />Salvar comentário AMI
            </Botao>
          </div>
        </div>
      </div>

      <div className="rounded-2xl bg-gradient-to-b from-pei-800 to-pei-900 p-1 shadow-card">
        <div className="h-full rounded-[13px] bg-white p-5 sm:p-6">
          <div className="flex flex-wrap items-start justify-between gap-3 border-b border-pei-100 pb-4">
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Leitura integrada do caso</p>
              <h4 className="mt-1 font-serif text-[19px] font-semibold text-tinta-900">Síntese completa de todas as fontes</h4>
              <p className="mt-1 text-[12px] leading-relaxed text-tinta-500">Une respostas, comentários, AEE, AMI, psicologia e documentos anexados.</p>
            </div>
            {aluno.sintese && <Selo status={aluno.sintese.status || 'Rascunho'} tamanho="sm" />}
          </div>

          {!aluno.sintese ? (
            <div className="grid min-h-[310px] place-items-center py-8 text-center">
              <div>
                <span className="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-pei-50 text-pei-600 ring-1 ring-pei-200"><Icone nome="faisca" className="h-5 w-5" /></span>
                <p className="mt-4 text-[13px] leading-relaxed text-tinta-500">A síntese pode ser gerada assim que houver ao menos uma ficha docente enviada.</p>
                <Botao className="mt-4" onClick={() => aoGerarSintese(aluno.id)}><Icone nome="faisca" className="h-4 w-4" />Gerar síntese completa</Botao>
              </div>
            </div>
          ) : (
            <>
              {editandoSintese ? (
                <textarea value={aluno.sintese.texto} rows={20} onChange={e => aoEditarSintese(aluno.id, e.target.value)}
                  className="mt-5 w-full resize-y rounded-xl border-0 bg-slate-50 px-4 py-4 font-serif text-[13.5px] leading-[1.75] text-tinta-800 ring-1 ring-inset ring-slate-200 focus:bg-white focus:ring-2 focus:ring-pei-400 outline-none" />
              ) : (
                <div className="mt-5 max-h-[520px] overflow-y-auto pr-2 font-serif text-[13.5px] leading-[1.75] text-tinta-700"><CorpoDocumento texto={aluno.sintese.texto} /></div>
              )}
              <div className="mt-5 flex flex-wrap gap-2 border-t border-pei-100 pt-4">
                <Botao variante="secundario" className="px-3.5 py-2 text-[12.5px]" onClick={() => setEditandoSintese(v => !v)}>{editandoSintese ? 'Concluir edição' : 'Editar síntese'}</Botao>
                <Botao variante="fantasma" className="px-3.5 py-2 text-[12.5px]" onClick={() => aoGerarSintese(aluno.id)}>Gerar novamente</Botao>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function RespostasProfessores({ alunos, aoGerar, aoAbrirDoc, aoAbrirAluno, aoAbrirAtribuicoes, aoAnexar, aoSalvarAMI, aoGerarSintese, aoEditarSintese }) {
  const [segmento, setSegmento] = useState('Todos');
  const [area, setArea] = useState('Todas');
  const [bloco, setBloco] = useState('Todos');
  const [aberto, setAberto] = useState('a1');

  const areasDisponiveis = [...new Set(alunos.flatMap(a => a.respostas.map(r => r.disciplina || r.area)))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const filtrados = alunos.filter(a =>
    (segmento === 'Todos' || a.segmento === segmento)
    && (area === 'Todas' || a.respostas.some(r => (r.disciplina || r.area) === area))
  );
  const totalEsperadas = alunos.reduce((s, a) => s + a.respostas.length, 0);
  const totalEnviadas = alunos.reduce((s, a) => s + enviadas(a).length, 0);
  const aeeEsperadas = alunos.filter(frequentaAEE).length;
  const aeeEnviadas = alunos.filter(a => frequentaAEE(a) && respostaAEE(a).status === 'Enviado').length;
  const semEstudo = alunos.filter(a => !a.documentos.estudo).length;

  return (
    <div className="space-y-7">
      <TituloSecao
        sobretitulo="Psicologia"
        titulo="Respostas docentes e contribuição do AEE"
        descricao={`Fichas docentes e, quando aplicável, a contribuição posterior do AEE em ${PERIODO_ATUAL}. A psicologia integra essas perspectivas ao estudo de caso e ao PEI.`}
      />

      <Cartao className="grid sm:grid-cols-2 xl:grid-cols-4 divide-y sm:divide-y-0 sm:divide-x divide-pei-100">
        {[
          { rot: 'fichas recebidas', val: `${totalEnviadas}/${totalEsperadas}`, ic: 'caixa', tom: 'bg-pei-50 ring-pei-200 text-pei-600' },
          { rot: 'respostas do AEE', val: `${aeeEnviadas}/${aeeEsperadas}`, ic: 'escudo', tom: 'bg-sabia-50 ring-sabia-200 text-sabia-600' },
          { rot: `aluno${alunos.length === 1 ? '' : 's'} acompanhado${alunos.length === 1 ? '' : 's'}`, val: alunos.length, ic: 'aluno', tom: 'bg-lilas-50 ring-lilas-200 text-lilas-500' },
          { rot: semEstudo === 1 ? 'aguarda estudo de caso' : 'aguardam estudo de caso', val: semEstudo, ic: 'faisca', tom: 'bg-ambar-50 ring-ambar-200 text-ambar-500' }
        ].map(it => (
          <div key={it.rot} className="flex items-center gap-3.5 px-5 sm:px-6 py-4">
            <span className={`grid h-9 w-9 shrink-0 place-items-center rounded-lg ring-1 ${it.tom}`}><Icone nome={it.ic} className="h-[18px] w-[18px]" /></span>
            <div className="min-w-0">
              <span className="font-serif text-[26px] leading-none font-semibold text-tinta-900">{it.val}</span>
              <p className="text-[12.5px] text-tinta-500 leading-snug mt-1">{it.rot}</p>
            </div>
          </div>
        ))}
      </Cartao>

      <div className="flex flex-wrap items-center gap-x-6 gap-y-3">
        <Filtro rotulo="Segmento:" opcoes={['Todos', ...SEGMENTOS]} valor={segmento} aoMudar={setSegmento} />
        <label className="flex items-center gap-2 text-[12px] text-tinta-400">
          Área/aula:
          <select value={area} onChange={e => setArea(e.target.value)} className="min-w-[190px] rounded-xl border-0 bg-white px-3.5 py-2 text-[12.5px] font-medium text-tinta-700 shadow-suave ring-1 ring-inset ring-pei-200 focus:ring-2 focus:ring-pei-400 outline-none">
            {['Todas', ...areasDisponiveis].map(opcao => <option key={opcao}>{opcao}</option>)}
          </select>
        </label>
        <Filtro rotulo="Destacar perfil:" opcoes={['Todos', ...BLOCOS.map(b => b.curto)]} valor={bloco} aoMudar={setBloco} />
      </div>

      {filtrados.length === 0 ? (
        <EstadoVazio icone="caixa" titulo="Nenhum aluno com estes filtros"
          texto="Não há respostas na combinação de segmento e área selecionada. Limpe os filtros para ver todas as contribuições."
          acao={<Botao variante="secundario" onClick={() => { setSegmento('Todos'); setArea('Todas'); }}>Limpar filtros</Botao>} />
      ) : (
        <div className="space-y-3">
          {filtrados.map((a, i) => {
            const envs = enviadas(a);
            const completo = envs.length === a.respostas.length;
            const expandido = aberto === a.id;
            const cons = consolidar(a);
            const divs = divergencias(a);
            const blocoId = bloco === 'Todos' ? null : BLOCOS.find(b => b.curto === bloco).id;
            const aeePendente = frequentaAEE(a) && respostaAEE(a).status !== 'Enviado';

            return (
              <Cartao key={a.id} className="animar-item overflow-hidden" style={{ animationDelay: `${i * 55}ms` }}>
                <button onClick={() => setAberto(expandido ? null : a.id)}
                  className="w-full p-5 flex flex-wrap items-center gap-x-5 gap-y-3 text-left transition-colors duration-200 hover:bg-pei-50/40">
                  <Avatar nome={a.nome} />
                  <div className="min-w-0 flex-1">
                    <h3 className="font-serif text-[17px] font-semibold text-tinta-900 leading-snug">{a.nome}</h3>
                    <p className="text-[13px] text-tinta-500 mt-0.5">{a.serie} · {a.segmento} · {a.categoria}</p>
                    {cons && blocoId && (
                      <p className="text-[12.5px] mt-1.5" style={{ color: COR_BLOCO[blocoId] }}>
                        {CURTO_BLOCO[blocoId]}: {rotuloDesempenho(desempenho(cons.perfis[blocoId]))}
                      </p>
                    )}
                  </div>

                  <div className="w-full sm:w-36 sm:shrink-0">
                    <div className="flex items-baseline justify-between gap-2 mb-1.5">
                      <span className="text-[11.5px] text-tinta-500">fichas</span>
                      <span className={`text-[12.5px] font-semibold tabular-nums ${completo ? 'text-sabia-700' : 'text-ambar-600'}`}>{envs.length}/{a.respostas.length}</span>
                    </div>
                    <Barra valor={envs.length} total={a.respostas.length} tom={completo ? 'bg-sabia-500' : 'bg-ambar-400'} />
                  </div>

                  <div className="flex w-full flex-wrap items-center justify-between gap-x-3 gap-y-2 sm:w-auto sm:shrink-0 sm:justify-start">
                    {a.comentario && <span className="text-lilas-500" title="Comentário da psicologia registrado"><Icone nome="balao" className="h-4 w-4" /></span>}
                    {frequentaAEE(a) && <div className="text-right"><p className="text-[10.5px] uppercase tracking-[0.1em] text-tinta-400 font-semibold mb-1">AEE</p><Selo status={statusFluxoAEE(a)} tamanho="sm" /></div>}
                    <div className="text-right">
                      <p className="text-[10.5px] uppercase tracking-[0.1em] text-tinta-400 font-semibold mb-1">Relatório</p>
                      <Selo status={statusDoc(a.documentos.relatorio)} tamanho="sm" />
                    </div>
                    <div className="text-right">
                      <p className="text-[10.5px] uppercase tracking-[0.1em] text-tinta-400 font-semibold mb-1">Estudo</p>
                      <Selo status={statusDoc(a.documentos.estudo)} tamanho="sm" />
                    </div>
                    <div className="text-right">
                      <p className="text-[10.5px] uppercase tracking-[0.1em] text-tinta-400 font-semibold mb-1">PEI</p>
                      <Selo status={statusDoc(a.documentos.pei)} tamanho="sm" />
                    </div>
                    <span className={`ml-1 text-tinta-400 transition-transform duration-200 ${expandido ? 'rotate-180' : ''}`}><Icone nome="baixo" className="h-4 w-4" /></span>
                  </div>
                </button>

                {expandido && (
                  <div className="animar-item border-t border-pei-100 bg-pei-50/30 p-5">
                    {a.respostas.length === 0 && (
                      <div className="mb-4 rounded-xl bg-ambar-50 ring-1 ring-inset ring-ambar-200 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                        <p className="text-[12.5px] text-ambar-600 leading-relaxed">
                          Nenhum professor foi atribuído a este aluno ainda — não há fichas a receber.
                        </p>
                        <Botao variante="secundario" className="px-3 py-1.5 text-[12.5px]" onClick={() => aoAbrirAtribuicoes()}>
                          Definir professores<Icone nome="seta" className="h-3.5 w-3.5" />
                        </Botao>
                      </div>
                    )}
                    {a.respostas.length > 0 && !completo && (
                      <div className="mb-4 rounded-xl bg-ambar-50 ring-1 ring-inset ring-ambar-200 px-4 py-3">
                        <p className="text-[12.5px] text-ambar-600 leading-relaxed">
                          Faltam {a.respostas.length - envs.length} de {a.respostas.length} fichas. É possível gerar os documentos com o que já chegou —
                          as fichas ausentes ficam explicitamente registradas no texto.
                        </p>
                      </div>
                    )}

                    <div className="grid gap-3 xl:grid-cols-2">
                      {a.respostas.filter(r => area === 'Todas' || (r.disciplina || r.area) === area).map(r => <CartaoResposta key={r.area + r.professor} resposta={r} />)}
                    </div>

                    <CartaoRespostaAEE aluno={a} />

                    {envs.length > 0 && (
                      <PainelFontesESintese aluno={a} aoAnexar={aoAnexar} aoSalvarAMI={aoSalvarAMI}
                        aoGerarSintese={aoGerarSintese} aoEditarSintese={aoEditarSintese} />
                    )}

                    {cons && (
                      <div className="mt-4 rounded-xl bg-white ring-1 ring-inset ring-pei-200 p-4">
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                          <div>
                            <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Perfil consolidado</p>
                            <p className="text-[12px] text-tinta-500 mt-1">Leitura por predominância em {envs.length} fichas · sem cálculo de média</p>
                          </div>
                          <Botao variante="fantasma" className="px-3 py-1.5 text-[12.5px]" onClick={() => aoAbrirAluno(a.id)}>
                            Ver prontuário<Icone nome="seta" className="h-3.5 w-3.5" />
                          </Botao>
                        </div>
                        <div className="grid lg:grid-cols-2 gap-x-8 gap-y-4">
                          <PerfilBlocos perfis={cons.perfis} />
                          <div className="text-[12.5px] text-tinta-600 leading-relaxed space-y-2">
                            {divs.length ? (
                              <p><strong className="font-semibold text-tinta-900">Divergência entre fichas:</strong> em {listar(divs.slice(0, 2).map(d => `“${minusculo(d.rotulo)}”`))} os registros variam de forma relevante — ponto a explorar no estudo de caso.</p>
                            ) : (
                              <p>Os registros dos professores são coerentes entre si, sem discrepâncias relevantes.</p>
                            )}
                            {(() => {
                              const criticos = itensPorNivel(cons.niveis, v => v >= 4);
                              return criticos.length ? (
                                <p><strong className="font-semibold text-tinta-900">Itens em nível 4 ou 5:</strong> {listar(criticos.slice(0, 4).map(i => minusculo(i.rotulo)))}.</p>
                              ) : <p>Nenhum item em nível de prioridade neste período.</p>;
                            })()}
                          </div>
                        </div>
                      </div>
                    )}

                    {a.comentario && (
                      <div className="mt-4 rounded-xl bg-lilas-50 ring-1 ring-inset ring-lilas-200 p-4">
                        <div className="flex items-center gap-2 mb-2">
                          <Icone nome="balao" className="h-4 w-4 text-lilas-500" />
                          <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-lilas-600">Considerações da psicologia</p>
                        </div>
                        <p className="text-[13px] text-tinta-700 leading-relaxed">{a.comentario.texto}</p>
                        <p className="text-[11.5px] text-tinta-400 mt-2">{a.comentario.autor} · {formatarData(a.comentario.data)}</p>
                      </div>
                    )}

                    <div className="mt-4 flex flex-wrap items-center gap-2">
                      <Botao variante={a.documentos.relatorio ? 'secundario' : 'primario'} disabled={!envs.length}
                        titulo={!envs.length ? 'É preciso ao menos uma ficha enviada' : undefined}
                        onClick={() => (a.documentos.relatorio ? aoAbrirDoc(a.id, 'relatorio') : aoGerar(a.id, 'relatorio'))}>
                        <Icone nome="ficha" className="h-4 w-4" />{a.documentos.relatorio ? 'Abrir relatório escolar' : 'Gerar relatório escolar'}
                      </Botao>
                      <Botao variante={a.documentos.estudo ? 'secundario' : 'primario'} disabled={!envs.length || (!a.documentos.estudo && aeePendente)}
                        titulo={!envs.length ? 'É preciso ao menos uma ficha enviada' : (!a.documentos.estudo && aeePendente) ? 'Aguardar a resposta do AEE' : undefined}
                        onClick={() => (a.documentos.estudo ? aoAbrirDoc(a.id, 'estudo') : aoGerar(a.id, 'estudo'))}>
                        <Icone nome="faisca" className="h-4 w-4" />{a.documentos.estudo ? 'Abrir estudo de caso' : 'Gerar estudo de caso'}
                      </Botao>
                      <Botao variante={a.documentos.pei ? 'secundario' : 'primario'} disabled={!envs.length || (!a.documentos.pei && aeePendente)}
                        titulo={!envs.length ? 'É preciso ao menos uma ficha enviada' : (!a.documentos.pei && aeePendente) ? 'Aguardar a resposta do AEE' : undefined}
                        onClick={() => (a.documentos.pei ? aoAbrirDoc(a.id, 'pei') : aoGerar(a.id, 'pei'))}>
                        <Icone nome="plano" className="h-4 w-4" />{a.documentos.pei ? 'Abrir PEI' : 'Gerar PEI'}
                      </Botao>
                      {!envs.length && <span className="text-[12px] text-tinta-400">Os documentos só podem ser gerados a partir de pelo menos uma ficha enviada.</span>}
                      {envs.length > 0 && aeePendente && (!a.documentos.estudo || !a.documentos.pei) && <span className="text-[12px] text-ambar-600">Este estudante frequenta a Sala de Recursos. Aguarde a contribuição do AEE antes de gerar o estudo de caso e o PEI.</span>}
                    </div>
                  </div>
                )}
              </Cartao>
            );
          })}
        </div>
      )}
    </div>
  );
}
/* ═══════════════════════════════════════════════════════════════════
   10. DOCUMENTO — relatório, estudo de caso e PEI usam a mesma tela

const TIPOS_DOC = {
  relatorio: {
    nome: 'Relatório de acompanhamento', acao: 'relatório', titulo: 'Relatório de Acompanhamento Escolar',
    sobretitulo: 'Acompanhamento docente', icone: 'ficha',
    descricao: 'Documento escolar produzido a partir das respostas e dos comentários dos professores, preservando cada contexto sem cálculo de média.',
    vazio: 'Nenhum relatório de acompanhamento em aberto',
    vazioTexto: 'Abra a tela de respostas, escolha um aluno e clique em “Gerar relatório escolar”.'
  },
  estudo: {
    nome: 'Estudo de caso', acao: 'estudo de caso', titulo: 'Estudo de Caso',
    sobretitulo: 'Análise das fichas', icone: 'faisca',
    descricao: 'Síntese e análise das fichas enviadas pelos professores. Revise, registre suas considerações e aprove para incorporar ao prontuário.',
    vazio: 'Nenhum estudo de caso em aberto',
    vazioTexto: 'Abra a tela de respostas dos professores, escolha um aluno e clique em “Gerar estudo de caso”.'
  },
  pei: {
    nome: 'PEI', acao: 'PEI', titulo: 'Plano Educacional Individualizado',
    sobretitulo: 'Plano do período', icone: 'plano',
    descricao: 'Documento completo: estudo de caso integrado, objetivos, adaptações, acessibilidades, recursos e estratégias por professor.',
    vazio: 'Nenhum PEI em aberto',
    vazioTexto: 'Abra a tela de respostas dos professores, escolha um aluno e clique em “Gerar PEI”.'
  }
};

/* Comentário do setor de psicologia sobre o estudante.
   Fica registrado no aluno e é incorporado ao PEI na geração seguinte. */
function PainelComentario({ aluno, perfil, aoSalvar, tipo }) {
  const [texto, setTexto] = useState(aluno.comentario ? aluno.comentario.texto : '');
  const [salvo, setSalvo] = useState(false);
  const [aberto, setAberto] = useState(false);
  useEffect(() => {
    setTexto(aluno.comentario ? aluno.comentario.texto : '');
    setSalvo(false);
    setAberto(false);
  }, [aluno.id]);

  useEffect(() => {
    if (!aberto) return;
    const overflowAnterior = document.body.style.overflow;
    const fecharComEsc = e => { if (e.key === 'Escape') setAberto(false); };
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', fecharComEsc);
    return () => {
      document.body.style.overflow = overflowAnterior;
      document.removeEventListener('keydown', fecharComEsc);
    };
  }, [aberto]);

  const mudou = texto.trim() !== (aluno.comentario ? aluno.comentario.texto.trim() : '');
  const jaNoPei = aluno.documentos.pei && aluno.comentario;
  const limite = 4000;

  function salvarComentario() {
    aoSalvar(aluno.id, texto);
    setSalvo(true);
    setAberto(false);
  }

  return (
    <>
      <Cartao className="p-6">
        <div className="flex items-start gap-3">
          <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-lilas-50 text-lilas-500 ring-1 ring-inset ring-lilas-200">
            <Icone nome="balao" className="h-[18px] w-[18px]" />
          </span>
          <div className="min-w-0 flex-1">
            <h4 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400">Considerações da psicologia</h4>
            <p className="text-[12.5px] text-tinta-500 leading-relaxed mt-1.5">
              Registro profissional complementar às fichas dos professores.
            </p>
          </div>
        </div>

        {aluno.comentario ? (
          <div className="mt-4 rounded-xl bg-lilas-50/60 p-3.5 ring-1 ring-inset ring-lilas-100">
            <p className="line-clamp-3 text-[12.5px] leading-relaxed text-tinta-600">{aluno.comentario.texto}</p>
            <p className="mt-2 text-[10.5px] text-tinta-400">Registrado em {formatarData(aluno.comentario.data)}</p>
          </div>
        ) : (
          <div className="mt-4 rounded-xl border border-dashed border-lilas-200 px-3.5 py-3 text-[12px] leading-relaxed text-tinta-400">
            Nenhuma consideração registrada para este estudante.
          </div>
        )}

        <Botao variante="secundario" className="mt-4 w-full justify-center border-lilas-200 text-lilas-600 hover:bg-lilas-50" onClick={() => setAberto(true)}>
          <Icone nome="balao" className="h-4 w-4" />{aluno.comentario ? 'Abrir e editar comentário' : 'Escrever comentário'}
        </Botao>

        {salvo && !mudou && <p className="mt-2.5 text-center text-[11.5px] text-sabia-700">Comentário salvo com sucesso.</p>}
        {mudou && !aberto && <p className="mt-2.5 text-center text-[11.5px] text-ambar-600">Há alterações ainda não salvas.</p>}
        {tipo === 'estudo' && aluno.comentario && !mudou && (
          <p className="text-[11.5px] text-tinta-400 mt-2.5 leading-relaxed">
            {!jaNoPei ? 'Será incorporado ao gerar o PEI.' : 'O PEI já existe — use “Gerar novamente” para incorporar alterações futuras.'}
          </p>
        )}
      </Cartao>

      {aberto && ReactDOM.createPortal(
        <div className="fixed inset-0 z-[100] flex items-end justify-center p-0 sm:items-center sm:p-6" role="dialog" aria-modal="true" aria-labelledby="titulo-comentario">
          <button className="animar-veu absolute inset-0 bg-slate-950/60 backdrop-blur-sm" onClick={() => setAberto(false)} aria-label="Fechar comentário" />
          <section className="animar-item relative flex max-h-[96dvh] w-full flex-col overflow-hidden rounded-t-[24px] bg-white shadow-2xl sm:max-h-[90dvh] sm:max-w-4xl sm:rounded-[24px]">
            <header className="flex items-start gap-4 border-b border-slate-200 px-5 py-5 sm:px-7 sm:py-6">
              <span className="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-lilas-50 text-lilas-500 ring-1 ring-inset ring-lilas-200">
                <Icone nome="balao" className="h-5 w-5" />
              </span>
              <div className="min-w-0 flex-1">
                <p className="text-[10.5px] font-semibold uppercase tracking-[0.15em] text-lilas-500">Registro do setor de psicologia</p>
                <h2 id="titulo-comentario" className="mt-1 font-serif text-[22px] font-semibold leading-tight text-tinta-900 sm:text-[27px]">Considerações sobre {primeiroNome(aluno.nome)}</h2>
                <p className="mt-1 text-[12.5px] text-tinta-500">{aluno.serie} · {aluno.segmento} · {PERIODO_ATUAL}</p>
              </div>
              <button onClick={() => setAberto(false)} className="grid h-10 w-10 shrink-0 place-items-center rounded-xl text-tinta-400 transition hover:bg-slate-100 hover:text-tinta-700" aria-label="Fechar">
                <Icone nome="fechar" className="h-5 w-5" />
              </button>
            </header>

            <div className="min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-7 sm:py-6">
              <div className="mb-4 flex items-start gap-3 rounded-xl bg-lilas-50/70 px-4 py-3 ring-1 ring-inset ring-lilas-100">
                <Icone nome="faisca" className="mt-0.5 h-4 w-4 shrink-0 text-lilas-500" />
                <p className="text-[12.5px] leading-relaxed text-lilas-600">
                  Registre hipóteses, leitura do caso, contexto familiar relevante e orientações que não aparecem nas fichas docentes.
                  {tipo === 'estudo' ? ' Este texto será incorporado ao PEI quando o plano for gerado.' : ' Ao salvar, gere novamente o PEI para atualizar o documento.'}
                </p>
              </div>

              <label className="text-[12px] font-semibold uppercase tracking-[0.12em] text-tinta-500" htmlFor="comentario-psicologia">Comentário profissional</label>
              <textarea id="comentario-psicologia" autoFocus value={texto} maxLength={limite} onChange={e => { setTexto(e.target.value); setSalvo(false); }}
                placeholder="Descreva a leitura integrada do caso, os fatores que parecem influenciar o desempenho, as orientações à equipe e os pontos que deverão compor o PEI."
                className="mt-2.5 min-h-[330px] w-full resize-y rounded-2xl border-0 bg-slate-50 px-5 py-4 text-[15px] leading-[1.75] text-tinta-900 ring-1 ring-inset ring-slate-200 placeholder:text-tinta-400 focus:bg-white focus:ring-2 focus:ring-lilas-400 outline-none transition sm:min-h-[390px]" />
            </div>

            <footer className="border-t border-slate-200 bg-white px-5 py-4 sm:px-7">
              <div className="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div className="flex items-center justify-between gap-4 sm:justify-start">
                  <span className={`text-[12px] tabular-nums ${texto.length > limite * 0.9 ? 'text-telha-500' : 'text-tinta-400'}`}>{texto.length.toLocaleString('pt-BR')} / {limite.toLocaleString('pt-BR')} caracteres</span>
                  {mudou && <span className="rounded-full bg-ambar-50 px-2.5 py-1 text-[11px] font-medium text-ambar-600 ring-1 ring-inset ring-ambar-200">Não salvo</span>}
                </div>
                <div className="flex gap-2.5">
                  <Botao variante="fantasma" className="flex-1 justify-center sm:flex-none" onClick={() => setAberto(false)}>Fechar</Botao>
                  <Botao className="flex-1 justify-center sm:flex-none" disabled={!mudou} onClick={salvarComentario}>
                    <Icone nome="check" className="h-4 w-4" />Salvar comentário
                  </Botao>
                </div>
              </div>
            </footer>
          </section>
        </div>,
        document.body
      )}
    </>
  );
}

function TelaDocumento({ alunos, tipo, contexto, perfil, setTexto, aoAprovar, aoRegerar, aoGerar, aoComentar, irPara }) {
  const [editando, setEditando] = useState(false);
  const cfg = TIPOS_DOC[tipo];
  // o contexto guarda só o aluno: alternar entre estudo e PEI pelo menu mantém o mesmo aluno
  const aluno = contexto ? alunos.find(a => a.id === contexto.alunoId) : null;
  const doc = aluno ? aluno.documentos[tipo] : null;

  useEffect(() => { setEditando(false); }, [contexto && contexto.alunoId, tipo]);

  if (!aluno) {
    return (
      <div>
        <TituloSecao sobretitulo={cfg.sobretitulo} titulo={cfg.nome} />
        <EstadoVazio icone={cfg.icone} titulo={cfg.vazio} texto={cfg.vazioTexto}
          acao={<Botao onClick={() => irPara('respostas')}>Ir para as respostas dos professores</Botao>} />
      </div>
    );
  }

  if (!doc) {
    return (
      <div>
        <TituloSecao sobretitulo={cfg.sobretitulo} titulo={`${cfg.nome} — ${primeiroNome(aluno.nome)}`} />
        <EstadoVazio icone={cfg.icone} titulo={`${cfg.nome} ainda não elaborado`}
          texto={`${aluno.nome} tem ${enviadas(aluno).length} de ${aluno.respostas.length} fichas recebidas neste período. Gere o documento a partir delas — as fichas que ainda não chegaram ficam registradas no texto.`}
          acao={
            <div className="flex flex-wrap gap-2 justify-center">
              <Botao onClick={() => aoGerar(aluno.id, tipo)}><Icone nome={cfg.icone} className="h-4 w-4" />Gerar {cfg.acao}</Botao>
              <Botao variante="secundario" onClick={() => irPara('respostas')}>Ver as respostas</Botao>
            </div>
          } />
      </div>
    );
  }

  const aprovado = doc.status === 'Aprovado';
  const envs = enviadas(aluno);
  const cons = consolidar(aluno);
  const completo = envs.length === aluno.respostas.length;
  const aguardaAEE = tipo !== 'relatorio' && frequentaAEE(aluno) && respostaAEE(aluno).status !== 'Enviado';
  const comentarioNovo = tipo === 'pei' && aluno.comentario && !doc.texto.includes('Considerações do setor de psicologia');
  const aeeEnviado = frequentaAEE(aluno) && respostaAEE(aluno).status === 'Enviado';
  const aeeNovo = tipo !== 'relatorio' && aeeEnviado && !doc.texto.includes(tipo === 'pei' ? 'Articulação com o AEE' : 'Contribuição do AEE');
  const atualizacaoPendente = comentarioNovo || aeeNovo;

  return (
    <div>
      <TituloSecao
        sobretitulo={cfg.sobretitulo}
        titulo={`${cfg.nome} — ${primeiroNome(aluno.nome)}`}
        descricao={cfg.descricao}
        acao={
          <div className="flex flex-wrap gap-2">
            <Botao variante="fantasma" onClick={() => irPara('respostas')}>← Voltar às respostas</Botao>
            <Botao variante="secundario" onClick={() => aoRegerar(aluno.id, tipo)}>Gerar novamente</Botao>
          </div>
        }
      />

      {atualizacaoPendente && (
        <div className="animar-aviso mb-5 flex items-start gap-3 rounded-2xl bg-lilas-50 ring-1 ring-inset ring-lilas-200 px-5 py-4">
          <span className="mt-0.5 text-lilas-500 shrink-0"><Icone nome="alerta" className="h-[18px] w-[18px]" /></span>
          <p className="flex-1 text-[13.5px] leading-relaxed text-lilas-600">
            {comentarioNovo && aeeNovo
              ? 'Há novas considerações da psicologia e uma resposta do AEE posteriores a este documento.'
              : comentarioNovo ? 'Há considerações da psicologia registradas depois deste plano ter sido gerado.'
              : 'A equipe de AEE enviou a contribuição da Sala de Recursos depois deste documento ter sido gerado.'}
            <strong className="font-semibold"> Use “Gerar novamente”</strong> para incorporar as informações ao texto.
          </p>
        </div>
      )}

      <div className="grid gap-5 lg:grid-cols-[1fr_300px] items-start">
        <div className="rounded-2xl bg-gradient-to-b from-pei-100/70 to-transparent p-3 sm:p-5">
          <article className="mx-auto max-w-3xl rounded-lg bg-white shadow-folha ring-1 ring-pei-200/60 px-7 py-10 sm:px-11 sm:py-14 xl:px-16 xl:py-16 animar-item">
            <header className="text-center border-b border-pei-100 pb-7 mb-9">
              <p className="font-serif text-[13px] tracking-[0.24em] uppercase text-pei-600">{INSTITUICAO}</p>
              <p className="text-[11.5px] tracking-[0.14em] uppercase text-tinta-400 mt-1.5">{SETOR}</p>
              <h1 className="font-serif text-[26px] sm:text-[30px] font-semibold text-tinta-900 mt-6 leading-tight">{cfg.titulo}</h1>
            </header>

            <dl className="grid grid-cols-2 sm:grid-cols-4 gap-x-5 gap-y-4 text-[13px] mb-9">
              {[['Aluno', aluno.nome], ['Turma', aluno.turma], ['Período', PERIODO_ATUAL], ['Emissão', formatarData(HOJE_ISO)]].map(([k, v]) => (
                <div key={k}>
                  <dt className="text-[10.5px] uppercase tracking-[0.12em] text-tinta-400 font-semibold font-sans">{k}</dt>
                  <dd className="font-serif text-tinta-900 mt-1 leading-snug">{v}</dd>
                </div>
              ))}
            </dl>

            {editando ? (
              <textarea value={doc.texto} onChange={e => setTexto(aluno.id, tipo, e.target.value)} rows={26}
                className="w-full resize-y rounded-lg bg-pei-50/60 p-5 font-serif text-[15px] leading-[1.8] text-tinta-900 ring-1 ring-inset ring-pei-300 focus:ring-2 focus:ring-pei-500 outline-none transition" />
            ) : (
              <div className="font-serif text-[16px] leading-[1.8] text-tinta-800"><CorpoDocumento texto={doc.texto} justificado /></div>
            )}

            <footer className={`mt-14 pt-8 border-t border-pei-100 grid ${tipo === 'pei' ? `sm:grid-cols-2 ${frequentaAEE(aluno) ? 'xl:grid-cols-5' : 'xl:grid-cols-4'}` : 'sm:grid-cols-3'} gap-x-6 gap-y-10 text-center text-[12.5px] text-tinta-500`}>
              <div><div className="h-px bg-tinta-400/40 mb-2.5" />{PERFIS.psicologia.nome}<br /><span className="text-tinta-400">{SETOR}</span></div>
              <div><div className="h-px bg-tinta-400/40 mb-2.5" />{aluno.referencia}<br /><span className="text-tinta-400">Equipe de referência</span></div>
              {tipo === 'pei' && frequentaAEE(aluno) && <div><div className="h-px bg-tinta-400/40 mb-2.5" />{PERFIS.aee.nome}<br /><span className="text-tinta-400">AEE · Sala de Recursos</span></div>}
              {tipo === 'pei' && <div><div className="h-px bg-tinta-400/40 mb-2.5" />{aluno.nome}<br /><span className="text-tinta-400">Estudante (quando aplicável)</span></div>}
              <div><div className="h-px bg-tinta-400/40 mb-2.5" />&nbsp;<br /><span className="text-tinta-400">Responsável familiar</span></div>
            </footer>
            <p className="mt-10 text-center text-[10.5px] uppercase tracking-[0.18em] text-tinta-400 font-sans">Demonstração — dados fictícios</p>
          </article>
        </div>

        <div className="lg:sticky lg:top-6 space-y-4">
          <Cartao className="p-6">
            <div className="flex items-center justify-between gap-3">
              <h4 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400">Situação</h4>
              <Selo status={doc.status} tamanho="sm" />
            </div>
            <p className="text-[13px] text-tinta-500 leading-relaxed mt-3.5">
              {aprovado
                ? (tipo === 'pei' ? 'Documento aprovado e vinculado ao prontuário do aluno. O PEI fica visível, em leitura, para os professores das turmas.' : `${cfg.nome} aprovado e vinculado ao prontuário do aluno.`)
                : aguardaAEE ? 'A aprovação final está bloqueada até a equipe de AEE enviar a contribuição da Sala de Recursos.'
                : 'O documento não é publicado automaticamente. A aprovação registra a validação humana do texto.'}
            </p>
            <div className="mt-5 space-y-2.5">
              <Botao variante={editando ? 'primario' : 'secundario'} className="w-full" onClick={() => setEditando(e => !e)}>
                <Icone nome={editando ? 'check' : 'ficha'} className="h-4 w-4" />{editando ? 'Concluir edição' : 'Editar texto'}
              </Botao>
              <Botao variante="aprovar" className="w-full" disabled={aprovado || aguardaAEE} onClick={() => aoAprovar(aluno.id, tipo)}>
                <Icone nome={aguardaAEE && !aprovado ? 'cadeado' : 'escudo'} className="h-4 w-4" />{aprovado ? `${cfg.nome} aprovado` : aguardaAEE ? 'Aguardando resposta do AEE' : `Aprovar ${cfg.acao}`}
              </Botao>
              {tipo === 'estudo' && aprovado && (
                <Botao variante="secundario" className="w-full animar-item" onClick={() => irPara('pei')}>
                  Seguir para o PEI<Icone nome="seta" className="h-4 w-4" />
                </Botao>
              )}
              {tipo === 'pei' && aprovado && (
                <Botao variante="secundario" className="w-full animar-item" onClick={() => irPara('aluno')}>
                  Ver prontuário do aluno<Icone nome="seta" className="h-4 w-4" />
                </Botao>
              )}
            </div>
          </Cartao>

          {tipo !== 'relatorio' && <PainelComentario aluno={aluno} perfil={perfil} aoSalvar={aoComentar} tipo={tipo} />}

          <Cartao className="p-6">
            <h4 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400">Base do documento</h4>
            <p className="text-[11.5px] text-tinta-400 mt-1 mb-4">
              {envs.length} de {aluno.respostas.length} fichas{completo ? ' — todos os professores responderam' : ' recebidas'}.
            </p>
            <ul className="space-y-2 mb-4">
              {aluno.respostas.map(r => (
                <li key={r.area + r.professor} className="flex items-center justify-between gap-3 text-[12.5px]">
                  <span className="text-tinta-600 truncate">{r.disciplina || r.area}</span>
                  <Selo status={r.status} tamanho="sm" />
                </li>
              ))}
              {frequentaAEE(aluno) && (
                <li className="flex items-center justify-between gap-3 border-t border-pei-100 pt-2 text-[12.5px]">
                  <span className="text-lilas-600">AEE · Sala de Recursos</span>
                  <Selo status={statusFluxoAEE(aluno)} tamanho="sm" />
                </li>
              )}
            </ul>
            <div className="pt-4 border-t border-pei-100">
              <p className="text-[11px] uppercase tracking-[0.12em] text-tinta-400 font-semibold mb-3">Perfil consolidado</p>
              {cons && <PerfilBlocos perfis={cons.perfis} compacto />}
            </div>
          </Cartao>

          <div className="rounded-2xl bg-sabia-50 ring-1 ring-sabia-200 p-5">
            <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-sabia-700">Nesta demonstração</p>
            <p className="text-[12.5px] leading-relaxed text-sabia-800/90 mt-2.5">
              O documento é composto localmente, sem nenhuma chamada de rede. Em produção, esta é a etapa que
              consumiria o modelo de linguagem — recebendo as fontes autorizadas para este tipo de documento e mantendo o mesmo
              fluxo de revisão e aprovação humana.
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

  const aluno = alunos.find(a => a.id === alunoId) || null;
  const [visiveis, setVisiveis] = useState(BLOCOS.map(b => b.id));
  const [detalhe, setDetalhe] = useState('cognitivo');

    return (
      <div>
        <TituloSecao sobretitulo="Prontuário" titulo="Página do aluno" />

          texto="Escolha um aluno para visualizar o prontuário completo: dados cadastrais, documentos do período e evolução histórica por perfil."
          acao={<Botao onClick={() => irPara(somenteLeitura ? 'visaoGeral' : 'respostas')}>Escolher um aluno</Botao>} />

  const regs = periodos(aluno);
  const dados = regs.map(r => ({ periodo: r.periodo, ...Object.fromEntries(BLOCOS.map(b => [b.id, desempenho(r.perfis[b.id])])) }));
  const tendencias = analisarTendencia(aluno);
  const envs = enviadas(aluno);
  const cons = consolidar(aluno);
  const alternar = id => setVisiveis(v => (v.includes(id) ? v.filter(x => x !== id) : [...v, id]));

  const docPrincipal = aluno.documentos.pei || aluno.documentos.estudo;

  return (
    <div>

              // key por aluno: remonta o gráfico ao trocar de estudante, em vez de deixar

              <div className="ux-chart-scroll"><div className="min-w-[640px] sm:min-w-0"><GraficoEvolucao key={aluno.id} dados={dados} series={visiveis} /></div></div>
            ) : (
              <div className="h-[340px] grid place-items-center rounded-xl bg-pei-50/60 ring-1 ring-inset ring-pei-100">
                <p className="text-[13.5px] text-tinta-400 text-center px-6">Selecione ao menos um perfil acima para visualizar a evolução.</p>
              </div>
            )}

            <div className="mt-6 rounded-xl bg-pei-50/70 ring-1 ring-inset ring-pei-100 p-5">
              <div className="flex items-center gap-2 mb-3">
                <Icone nome="grafico" className="h-4 w-4 text-pei-600" />
                <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Leitura automática da tendência</p>
              </div>
              <ul className="space-y-2">
                {tendencias.map((t, i) => (
                  <li key={i} className="flex gap-2.5 text-[13.5px] text-tinta-700 leading-relaxed">
                    <span className="mt-2 h-1.5 w-1.5 rounded-full bg-pei-400 shrink-0" /><span>{t}</span>
                  </li>
                ))}
              </ul>
            </div>
          </Cartao>

          {cons && (
            <Cartao className="p-6 sm:p-7">
              <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                  <h3 className="font-serif text-xl font-semibold text-tinta-900">Itens do período</h3>
                  <p className="text-[13px] text-tinta-500 mt-1">Perfil consolidado a partir das {envs.length} fichas recebidas. Itens em nível 4 ou 5 aparecem destacados.</p>
                </div>
                <div className="inline-flex rounded-xl bg-pei-50 p-1 ring-1 ring-pei-100">
                  {BLOCOS.map(b => (
                    <button key={b.id} onClick={() => setDetalhe(b.id)}
                      className={`rounded-lg px-3 py-1.5 text-[12.5px] font-medium transition ${detalhe === b.id ? 'bg-white text-tinta-800 shadow-suave' : 'text-tinta-500 hover:text-tinta-700'}`}>
                      {b.curto}
                    </button>
                  ))}
                </div>
              </div>
              <ItensDoBloco bloco={detalhe} niveis={cons.niveis} destaque />
            </Cartao>
          )}
        </div>

        <div className="space-y-5">
          {aluno.comentario && (
            <Cartao className="p-6 sm:p-7 ring-lilas-200">
              <div className="flex items-center gap-2 mb-3">
                <Icone nome="balao" className="h-4 w-4 text-lilas-500" />
                <h3 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-lilas-600">Considerações da psicologia</h3>
              </div>
              <p className="text-[13.5px] text-tinta-700 leading-relaxed">{aluno.comentario.texto}</p>
              <p className="text-[11.5px] text-tinta-400 mt-3">{aluno.comentario.autor} · {formatarData(aluno.comentario.data)}</p>
            </Cartao>
          )}

          <Cartao className="p-6 sm:p-7">
            <div className="flex items-center justify-between gap-3 mb-4">
              <div>
                <h3 className="font-serif text-lg font-semibold text-tinta-900">{nomeDoc}</h3>
                <p className="text-[12.5px] text-tinta-500 mt-0.5">{PERIODO_ATUAL}</p>
              </div>
              {docPrincipal && <Selo status={docPrincipal.status} tamanho="sm" />}
            </div>
            {!docPrincipal ? (
              <p className="text-[13px] text-tinta-500 leading-relaxed">
                Nenhum documento elaborado para este período. A psicologia gera o estudo de caso e o PEI a partir das fichas recebidas.
              </p>
            ) : (
              <>
                {docPrincipal.status !== 'Aprovado' && (
                  <div className="mb-4 rounded-xl bg-ambar-50 ring-1 ring-inset ring-ambar-200 px-4 py-3">
                    <p className="text-[12.5px] text-ambar-600 leading-relaxed">
                      Texto ainda em <strong className="font-semibold">{docPrincipal.status.toLowerCase()}</strong> — pendente de aprovação.
                    </p>
                  </div>
                )}
                <div className="text-[13.5px] leading-[1.75] text-tinta-700 max-h-[420px] overflow-y-auto pr-2">
                  <CorpoDocumento texto={docPrincipal.texto} />
                </div>
              </>
            )}
          </Cartao>

          <Cartao className="p-6 sm:p-7">
            <h3 className="font-serif text-lg font-semibold text-tinta-900 mb-4">Histórico de períodos</h3>
            <ol className="relative border-l border-pei-200 ml-1.5 space-y-5">
              {[...regs].reverse().map(r => (
                <li key={r.periodo} className="pl-5">
                  <span className={`absolute -left-[5.5px] mt-1.5 h-2.5 w-2.5 rounded-full ring-2 ring-white ${r.consolidado ? 'bg-pei-500' : 'bg-sabia-500'}`} />
                  <div className="flex items-center justify-between gap-3">
                    <p className="text-[14px] font-medium text-tinta-900">{r.periodo}</p>
                    {r.consolidado && <Etiqueta tom="pei">{r.respostas} fichas</Etiqueta>}
                  </div>
                  <p className="text-[12.5px] text-tinta-500 mt-1.5">
                    Faixa predominante <strong className="font-medium text-tinta-700">{rotuloDesempenho(desempenho(nivelGeral(r.perfis)))}</strong>
                  </p>
                </li>
              ))}
            </ol>
          </Cartao>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   12. PERFIL COORDENAÇÃO — visão macro, somente leitura
   ═══════════════════════════════════════════════════════════════ */

function VisaoGeral({ alunos, aoAbrirAluno }) {
  const hora = new Date().getHours();
  const saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  const nomeMes = MESES[HOJE.getMonth()];

  const esperadas = alunos.reduce((s, a) => s + a.respostas.length, 0);
  const recebidas = alunos.reduce((s, a) => s + enviadas(a).length, 0);
  const aeeEsperadas = alunos.filter(frequentaAEE).length;
  const aeeRecebidas = alunos.filter(a => frequentaAEE(a) && respostaAEE(a).status === 'Enviado').length;
  const registrosEsperados = esperadas + aeeEsperadas;
  const registrosRecebidos = recebidas + aeeRecebidas;
  const peisAprovados = alunos.filter(a => a.documentos.pei && a.documentos.pei.status === 'Aprovado').length;
  const revisoesMes = alunos.filter(a => mesmoMes(a.proximaRevisao, HOJE));

  const pendencias = [];
  alunos.forEach(a => {
    pendentes(a).forEach(r => pendencias.push({ aluno: a, motivo: `Ficha de ${r.disciplina || r.area} pendente com ${r.professor}` }));
    if (frequentaAEE(a) && respostaAEE(a).status !== 'Enviado') {
      pendencias.push({ aluno: a, motivo: professoresConcluiram(a) ? 'Resposta do AEE liberada e ainda pendente' : 'Resposta do AEE aguardando a conclusão das fichas docentes' });
    }
    if (!a.documentos.pei) pendencias.push({ aluno: a, motivo: 'PEI ainda não elaborado para o período' });
    else if (a.documentos.pei.status !== 'Aprovado') pendencias.push({ aluno: a, motivo: `PEI em ${a.documentos.pei.status.toLowerCase()} — aguardando aprovação` });
  });

  // itens que mais pesam no colégio, a partir dos perfis consolidados
  const criticidade = ITENS.map(i => {
    const vals = alunos.map(a => consolidar(a)).filter(Boolean).map(c => c.niveis[i.id]);
    return { ...i, total: vals.length, n: vals.filter(v => v >= 4).length };
  }).sort((a, b) => b.n - a.n || a.rotulo.localeCompare(b.rotulo)).slice(0, 6);

  const porSegmento = SEGMENTOS.map(seg => {
    const doSeg = alunos.filter(a => a.segmento === seg);
    return {
      seg, alunos: doSeg.length,
      esperadas: doSeg.reduce((s, a) => s + a.respostas.length, 0),
      recebidas: doSeg.reduce((s, a) => s + enviadas(a).length, 0),
      peis: doSeg.filter(a => a.documentos.pei && a.documentos.pei.status === 'Aprovado').length
    };
  }).filter(x => x.alunos > 0);

  return (
    <div className="flex flex-col gap-8">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p className="text-[11px] font-semibold uppercase tracking-[0.16em] text-pei-500 mb-2">Coordenação</p>
          <h2 className="font-serif text-[28px] sm:text-[34px] leading-tight text-tinta-900 font-semibold">{saudacao}, Marina.</h2>
          <p className="text-[15px] text-tinta-500 mt-2">
            {recebidas} de {esperadas} fichas docentes e {aeeRecebidas} de {aeeEsperadas} respostas do AEE recebidas em {PERIODO_ATUAL}
            {pendencias.length ? ` · ${pendencias.length} ${pendencias.length === 1 ? 'pendência' : 'pendências'} em aberto.` : ' · nenhuma pendência em aberto.'}
          </p>
        </div>
        <p className="text-[13px] text-tinta-400">{dataPorExtenso(HOJE_ISO)}</p>
      </div>

      <Cartao className="grid sm:grid-cols-2 xl:grid-cols-4 divide-y sm:divide-y-0 sm:divide-x divide-pei-100">
        {[
          { rot: `aluno${alunos.length === 1 ? '' : 's'} com PEI ativo`, val: alunos.length, ic: 'pessoas', tom: 'bg-pei-50 ring-pei-200 text-pei-600' },
          { rot: 'cobertura dos registros', val: `${Math.round((registrosRecebidos / registrosEsperados) * 100)}%`, ic: 'caixa', tom: 'bg-lilas-50 ring-lilas-200 text-lilas-500' },
          { rot: peisAprovados === 1 ? 'PEI aprovado' : 'PEIs aprovados', val: peisAprovados, ic: 'plano', tom: 'bg-sabia-50 ring-sabia-200 text-sabia-600' },
          { rot: `revis${revisoesMes.length === 1 ? 'ão' : 'ões'} em ${nomeMes}`, val: revisoesMes.length, ic: 'calendario', tom: 'bg-ambar-50 ring-ambar-200 text-ambar-500' }
        ].map(it => (
          <div key={it.rot} className="flex items-center gap-3.5 px-5 sm:px-6 py-4">
            <span className={`grid h-9 w-9 shrink-0 place-items-center rounded-lg ring-1 ${it.tom}`}><Icone nome={it.ic} className="h-[18px] w-[18px]" /></span>
            <div className="min-w-0">
              <span className="font-serif text-[26px] leading-none font-semibold text-tinta-900">{it.val}</span>
              <p className="text-[12.5px] text-tinta-500 leading-snug mt-1">{it.rot}</p>
            </div>
          </div>
        ))}
      </Cartao>

      <div className="order-4 grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] items-start">
        <Cartao className="overflow-hidden">
          <div className="px-5 sm:px-6 py-4 border-b border-pei-100 bg-pei-50/40">
            <h3 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Cobertura por segmento</h3>
          </div>
          <div className="divide-y divide-pei-100">
            {porSegmento.map(s => (
              <div key={s.seg} className="px-5 sm:px-6 py-4">
                <div className="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 mb-2.5">
                  <p className="text-[14.5px] font-medium text-tinta-900">{s.seg}</p>
                  <p className="text-[12.5px] text-tinta-500">{s.alunos} {s.alunos === 1 ? 'aluno' : 'alunos'} · {s.peis} {s.peis === 1 ? 'PEI aprovado' : 'PEIs aprovados'}</p>
                </div>
                <div className="flex items-center gap-3">
                  <Barra valor={s.recebidas} total={s.esperadas} tom={s.recebidas === s.esperadas ? 'bg-sabia-500' : 'bg-ambar-400'} />
                  <span className="text-[12.5px] tabular-nums text-tinta-600 shrink-0 w-12 text-right">{s.recebidas}/{s.esperadas}</span>
                </div>
              </div>
            ))}
          </div>
        </Cartao>

        <Cartao className="overflow-hidden">
          <div className="px-5 sm:px-6 py-4 border-b border-pei-100 bg-pei-50/40">
            <h3 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Itens que mais pesam no colégio</h3>
          </div>
          <div className="px-5 sm:px-6 py-4 space-y-3">
            {criticidade.map(c => (
              <div key={c.id}>
                <div className="flex items-baseline justify-between gap-3 mb-1.5">
                  <span className="text-[12.5px] text-tinta-700 leading-snug">{c.rotulo}</span>
                  <span className="text-[11.5px] tabular-nums text-tinta-500 shrink-0">{c.n}/{c.total}</span>
                </div>
                <div className="h-1.5 w-full rounded-full bg-pei-100 overflow-hidden">
                  <div className="h-full rounded-full transition-all duration-500" style={{ width: `${c.total ? (c.n / c.total) * 100 : 0}%`, backgroundColor: COR_BLOCO[c.bloco] }} />
                </div>
              </div>
            ))}
            <p className="text-[11.5px] text-tinta-400 pt-1">A barra e o número mostram quantos alunos registraram cada item em nível 4 ou 5 — sem cálculo de média.</p>
          </div>
        </Cartao>
      </div>

      <Cartao className="order-3 overflow-hidden">
        <div className="flex items-center justify-between gap-3 px-5 sm:px-6 py-4 border-b border-pei-100 bg-pei-50/40">
          <h3 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-600">Precisa de atenção</h3>
          {pendencias.length > 0 && <span className="rounded-full bg-ambar-100 px-2.5 py-0.5 text-[11.5px] font-semibold text-ambar-600 tabular-nums">{pendencias.length}</span>}
        </div>
        {pendencias.length ? (
          <ul className="divide-y divide-pei-100">
            {pendencias.map((p, i) => (
              <li key={i} className="animar-item flex flex-wrap items-center gap-x-4 gap-y-3 px-5 sm:px-6 py-4 hover:bg-pei-50/50 transition-colors duration-200" style={{ animationDelay: `${i * 55}ms` }}>
                <Avatar nome={p.aluno.nome} tamanho="sm" />
                <div className="min-w-0 flex-1">
                  <p className="text-[14.5px] font-medium text-tinta-900 leading-snug">{p.aluno.nome}</p>
                  <p className="text-[13px] text-tinta-500 mt-0.5">{p.motivo}</p>
                </div>
                <Botao variante="secundario" className="px-3.5 py-2 text-[13px] shrink-0" onClick={() => aoAbrirAluno(p.aluno.id)}>
                  Ver prontuário<Icone nome="seta" className="h-3.5 w-3.5" />
                </Botao>
              </li>
            ))}
          </ul>
        ) : (
          <div className="flex items-center gap-4 px-6 py-7">
            <span className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-sabia-50 text-sabia-600 ring-1 ring-sabia-200"><Icone nome="check" className="h-5 w-5" /></span>
            <div>
              <p className="text-[14.5px] font-medium text-tinta-900">Tudo em dia</p>
              <p className="text-[13px] text-tinta-500 mt-0.5">Todas as fichas foram recebidas e todos os PEIs do período estão aprovados.</p>
            </div>
          </div>
        )}
      </Cartao>

      <div className="order-5">
        <h3 className="font-serif text-xl font-semibold text-tinta-900 mb-5">Alunos acompanhados</h3>
        <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
          {alunos.map((a, i) => {
            const regs = periodos(a);
            const ganho = regs.length > 1 ? desempenho(nivelGeral(regs[regs.length - 1].perfis)) - desempenho(nivelGeral(regs[0].perfis)) : null;
            const t = ganho === null ? null
              : ganho >= 0.3 ? { txt: `desempenho +${nl(ganho)}`, cls: 'text-sabia-700', seta: '↑' }
              : ganho <= -0.3 ? { txt: `desempenho −${nl(Math.abs(ganho))}`, cls: 'text-telha-500', seta: '↓' }
              : { txt: 'quadro estável', cls: 'text-tinta-500', seta: '→' };
            return (
              <div key={a.id} role="button" tabIndex={0} onClick={() => aoAbrirAluno(a.id)}
                onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); aoAbrirAluno(a.id); } }}
                style={{ animationDelay: `${i * 55}ms` }}
                className="group animar-item cursor-pointer rounded-2xl bg-white p-5 ring-1 ring-pei-200/70 shadow-suave flex flex-col transition-all duration-300 hover:shadow-card hover:-translate-y-0.5 hover:ring-pei-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-pei-500">
                <div className="flex items-start gap-3.5">
                  <Avatar nome={a.nome} />
                  <div className="min-w-0 flex-1">
                    <h4 className="font-serif text-[16.5px] font-semibold text-tinta-900 leading-snug">{a.nome}</h4>
                    <p className="text-[13px] text-tinta-500 mt-0.5">{a.serie} · {a.segmento}</p>
                    <div className="mt-2.5"><Selo status={statusDoc(a.documentos.pei)} tamanho="sm" /></div>
                  </div>
                </div>
                <div className="mt-auto pt-4">
                  <div className="flex items-center gap-2 text-[12.5px] text-tinta-500">
                    <Icone nome="calendario" className="h-[15px] w-[15px] text-pei-400" />Revisão em {formatarData(a.proximaRevisao)}
                  </div>
                  {t && <p className={`text-[12.5px] mt-1.5 ${t.cls}`}><span aria-hidden="true" className="mr-1">{t.seta}</span>{t.txt}</p>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════════════════════════
   13. CASCA DA APLICAÇÃO

const PAGINAS = {
  meusAlunos: { rotulo: 'Meus alunos', curto: 'Alunos', icone: 'pessoas', descricao: 'Turmas e pendências' },
  ficha: { rotulo: 'Ficha de observação', curto: 'Ficha', icone: 'ficha', descricao: 'Responder e enviar' },
  fichaAEE: { rotulo: 'Resposta do AEE', curto: 'Responder', icone: 'faisca', descricao: 'Registro da Sala de Recursos' },
  atribuicoes: { rotulo: 'Turmas e triagem', curto: 'Triagem', icone: 'lista', descricao: 'Responsáveis e indicação de PEI' },
  respostas: { rotulo: 'Respostas e AEE', curto: 'Respostas', icone: 'caixa', descricao: 'Contribuições por aluno' },
  relatorio: { rotulo: 'Relatório escolar', curto: 'Relatório', icone: 'ficha', descricao: 'Acompanhamento docente' },
  estudo: { rotulo: 'Estudo de caso', curto: 'Estudo', icone: 'faisca', descricao: 'Síntese e análise' },
  pei: { rotulo: 'PEI', curto: 'PEI', icone: 'plano', descricao: 'Plano individualizado' },
  aluno: { rotulo: 'Página do aluno', curto: 'Aluno', icone: 'grafico', descricao: 'Prontuário e evolução' },
  visaoGeral: { rotulo: 'Visão geral', curto: 'Visão geral', icone: 'painel', descricao: 'Panorama do colégio' }
};

function BarraLateral({ perfil, pagina, setPagina, marcas, aoSair, aberta, fechar }) {
  function navegar(id) { setPagina(id); fechar(); }
  const conteudo = (
    <>
      <div className="flex items-center gap-3 px-5 h-[76px] shrink-0 border-b border-pei-100">
        <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-pei-600 to-pei-800 text-white text-[13px] font-bold tracking-tight shadow-suave">PEI</span>
        <span className="leading-tight min-w-0">
          <span className="block font-serif text-[17px] font-semibold text-tinta-900">Sistema PEI</span>
          <span className="block text-[11px] text-tinta-400 tracking-wide truncate">{INSTITUICAO}</span>
        </span>
        <button onClick={fechar} className="lg:hidden ml-auto -mr-1 rounded-lg p-2 text-tinta-500 hover:bg-pei-50 hover:text-tinta-800 transition" aria-label="Fechar menu">
          <Icone nome="fechar" className="h-5 w-5" />
        </button>
      </div>

      <div className="px-5 py-4 border-b border-pei-100">
        <div className="flex items-center gap-2.5">
          <span className={`grid h-7 w-7 shrink-0 place-items-center rounded-full text-[10.5px] font-semibold ring-1 ${perfil.tom}`}>{perfil.sigla}</span>
          <div className="min-w-0">
            <p className="text-[12.5px] font-semibold text-tinta-800 leading-tight">Perfil {perfil.rotulo}</p>
            <p className="text-[11px] text-tinta-400 truncate">{perfil.cargo}</p>
          </div>
        </div>
      </div>

      <nav className="flex-1 overflow-y-auto px-3 py-5">
        <p className="px-2 mb-2 text-[10.5px] font-semibold uppercase tracking-[0.15em] text-tinta-400">Navegação</p>
        <ul className="space-y-1">
          {perfil.paginas.map(id => {
            const p = PAGINAS[id];
            const ativo = pagina === id;
            const marca = marcas[id];
            return (
              <li key={id}>
                <button onClick={() => navegar(id)}
                  className={`group relative w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-pei-400 ${
                    ativo ? 'bg-pei-50 text-pei-800 ring-1 ring-inset ring-pei-200' : 'text-tinta-600 hover:bg-pei-50/60 hover:text-pei-700'
                  }`}>
                  {ativo && <span className="absolute left-0 top-1/2 -translate-y-1/2 h-6 w-[3px] rounded-r-full bg-pei-700" />}
                  <Icone nome={p.icone} className={`h-[19px] w-[19px] shrink-0 transition-colors ${ativo ? 'text-pei-700' : 'text-tinta-400 group-hover:text-pei-600'}`} />
                  <span className="min-w-0 flex-1">
                    <span className="block text-[14px] font-medium leading-snug">{p.rotulo}</span>
                    <span className={`block text-[11.5px] leading-snug mt-0.5 ${ativo ? 'text-pei-600/80' : 'text-tinta-400'}`}>{p.descricao}</span>
                  </span>
                  {marca ? <span className="shrink-0 rounded-full bg-ambar-100 px-2 py-0.5 text-[11px] font-semibold text-ambar-600 tabular-nums">{marca}</span> : null}
                </button>
              </li>
            );

        <div className="mt-7 rounded-xl bg-pei-800 p-4 text-pei-100">
          <div className="flex items-center gap-2 mb-2">
