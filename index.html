// gera os textos dos documentos que já existem na semente
function semear(base) {
  return base.map(original => {
    const respostas = original.respostas.map(r => ({
      ...r,
      manifestacoes: normalizarManifestacoes(r.manifestacoes),
      comentariosBloco: comentariosBlocoDe(r)
    }));
    const aluno = {
      ...original,
      respostas,
      aee: normalizarAEE(original),
      anexos: JSON.parse(JSON.stringify(original.anexos || DOCUMENTOS_ANEXOS_SEMENTE[original.id] || [])),
      comentarioAMI: original.comentarioAMI || COMENTARIOS_AMI_SEMENTE[original.id] || null,
      sintese: original.sintese || null,
      documentos: { ...original.documentos, relatorio: original.documentos.relatorio || null }
    };
    const docs = {};
    ['relatorio', 'estudo', 'pei'].forEach(t => {
      const d = aluno.documentos[t];
      if (!d) { docs[t] = null; return; }
      const texto = t === 'relatorio' ? gerarRelatorioAcompanhamento(aluno) : t === 'estudo' ? gerarEstudoDeCaso(aluno) : gerarPEI(aluno);
      docs[t] = { status: d.status, texto };
    });
    return { ...aluno, documentos: docs };
  });
}

function App() {
  const [alunos, setAlunos] = useState(() => semear(ALUNOS_SEMENTE));
  const [perfilId, setPerfilId] = useState(null);
  const [menuAberto, setMenuAberto] = useState(false);
  const [pagina, setPagina] = useState('respostas');
  const [alunoId, setAlunoId] = useState(null);
  const [contexto, setContexto] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [responsaveisTurma, setResponsaveisTurma] = useState({ ...RESPONSAVEIS_TURMA_SEMENTE });

  const perfil = perfilId ? PERFIS[perfilId] : null;

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [pagina]);
  useEffect(() => {
    if (!aviso) return;
    const t = setTimeout(() => setAviso(null), 5500);
    return () => clearTimeout(t);
  }, [aviso]);

  function entrar(id) {
    setPerfilId(id);
    setPagina(PERFIS[id].inicial || PERFIS[id].paginas[0]);
    setAlunoId(null); setContexto(null); setAviso(null);
  }

  /* ── psicologia: montagem do ciclo ── */
  function atribuirPsicologa(turmaId, psicologaId) {
    const turma = TURMAS.find(t => t.id === turmaId);
    const psicologa = PSICOLOGAS.find(p => p.id === psicologaId);
    setResponsaveisTurma(atual => ({ ...atual, [turmaId]: psicologaId || null }));
    setAviso({ texto: psicologa
      ? `${psicologa.nome} agora é responsável pela triagem da turma ${turma.nome}.`
      : `A turma ${turma.nome} ficou sem psicóloga responsável pela triagem.`
    });
  }

  function alternarDocente(id, docente) {
    let acao = '';
    setAlunos(lista => lista.map(a => {
      if (a.id !== id) return a;
      const existente = respostaDoDocente(a, docente);
      if (existente) {
        if (existente.status === 'Enviado') return a; // ficha enviada não se remove
        acao = 'removida';
        return { ...a, respostas: a.respostas.filter(r => r !== existente) };
      }
      acao = 'atribuida';
      return { ...a, respostas: [...a.respostas, fichaPendente(docente, a.segmento)] };
    }));
    const alvo = alunos.find(a => a.id === id);
    const rotulo = docente.disciplina || docente.papel;
    setAviso({
      texto: acao === 'removida'
        ? `${docente.nome} (${rotulo}) deixou de responder por ${primeiroNome(alvo.nome)}.`
        : `${docente.nome} (${rotulo}) passou a responder por ${primeiroNome(alvo.nome)} — a ficha já aparece como pendente para ele.`
    });
  }

  function atribuirTodos(id) {
    setAlunos(lista => lista.map(a => {
      if (a.id !== id) return a;
      const novas = docentesDoSegmento(a.segmento)
        .filter(d => !respostaDoDocente(a, d))
        .map(d => fichaPendente(d, a.segmento));
      return novas.length ? { ...a, respostas: [...a.respostas, ...novas] } : a;
    }));
    const alvo = alunos.find(a => a.id === id);
    const faltavam = docentesDoSegmento(alvo.segmento).filter(d => !respostaDoDocente(alvo, d)).length;
    setAviso({
      texto: faltavam
        ? `${faltavam} ${faltavam === 1 ? 'nova atribuição criada' : 'novas atribuições criadas'} para ${primeiroNome(alvo.nome)}.`
        : `Todos os professores do segmento já respondem por ${primeiroNome(alvo.nome)}.`
    });
  }

  function alternarAEE(id, frequenta) {
    setAlunos(lista => lista.map(a => {
      if (a.id !== id) return a;
      const atual = a.aee || { frequenta: false, resposta: respostaAEEVazia() };
      return { ...a, aee: { ...atual, frequenta, resposta: atual.resposta || respostaAEEVazia() } };
    }));
    const alvo = alunos.find(a => a.id === id);
    setAviso({
      texto: frequenta
        ? `${primeiroNome(alvo.nome)} foi vinculad${alvo.genero === 'f' ? 'a' : 'o'} à Sala de Recursos. O AEE verá o estudante e responderá após as fichas dos professores.`
        : `${primeiroNome(alvo.nome)} deixou de aparecer no fluxo da Sala de Recursos. O registro anterior foi preservado nesta demonstração.`
    });
  }

  function incluirAluno(matriculaId) {
    const m = MATRICULADOS.find(x => x.id === matriculaId);
    if (!m) return;
    setAlunos(lista => (lista.some(a => a.matriculaId === matriculaId) ? lista : [...lista, alunoDeMatricula(m)]));
    setAviso({ texto: `${m.nome} foi marcad${m.genero === 'f' ? 'a' : 'o'} como estudante que necessita de PEI. Defina agora a equipe que responderá por ${m.genero === 'f' ? 'ela' : 'ele'}.` });
  }

  function removerAluno(id) {
    const alvo = alunos.find(a => a.id === id);
    setAlunos(lista => lista.filter(a => a.id !== id));
    if (alunoId === id) setAlunoId(null);
    if (contexto && contexto.alunoId === id) setContexto(null);
    if (alvo) setAviso({ texto: `A indicação de necessidade de PEI de ${alvo.nome} foi retirada deste período.` });
  }

  /* ── professor: envia a própria ficha ── */
  function enviarFicha(id, f) {
    const acessibilidades = JSON.parse(JSON.stringify(f.acessibilidades));
    const descricoesLegadas = [];
    if (acessibilidades.avaliacao.usa && acessibilidades.avaliacao.descricao.trim()) descricoesLegadas.push(acessibilidades.avaliacao.descricao.trim());
    if (acessibilidades.rotina.usa && acessibilidades.rotina.descricao.trim()) descricoesLegadas.push(acessibilidades.rotina.descricao.trim());
    const adaptacaoLegada = {
      necessita: acessibilidades.avaliacao.usa || acessibilidades.rotina.usa,
      quais: descricoesLegadas.join(' ')
    };
    setAlunos(lista => lista.map(a => {
      if (a.id !== id) return a;
      const respostas = a.respostas.map(r => r.professor !== perfil.nome ? r : {
        ...r,
        disciplina: fichaPolivalente(a.segmento) ? null : (f.disciplina || r.disciplina),
        dificuldadeDisciplina: fichaPolivalente(a.segmento) ? undefined : { ...f.dificuldadeDisciplina },
        niveis: { ...f.niveis },
        areasDesc: fichaPolivalente(a.segmento) ? { ...f.areasDesc } : undefined,
        manifestacoes: JSON.parse(JSON.stringify(f.manifestacoes)),
        comentariosBloco: { ...f.comentariosBloco },
        observacoes: f.observacoes,
        adaptacao: adaptacaoLegada,
        acessibilidades,
        estrategias: f.estrategias,
        outras: f.outras,
        status: 'Enviado', enviadoEm: HOJE_ISO
      });
      return { ...a, respostas };
    }));
    const alvo = alunos.find(a => a.id === id);
    setAviso({ texto: `Ficha de ${primeiroNome(alvo.nome)} enviada ao ${SETOR}. As respostas individuais e os comentários por bloco já estão disponíveis para leitura.` });
    setPagina('meusAlunos');
  }

  /* ── AEE: resposta posterior às fichas docentes ── */
  function enviarRespostaAEE(id, f) {
    setAlunos(lista => lista.map(a => {
      if (a.id !== id || !frequentaAEE(a) || !professoresConcluiram(a)) return a;
      return {
        ...a,
        aee: {
          ...a.aee,
          resposta: { ...f, recursos: [...f.recursos], status: 'Enviado', enviadoEm: HOJE_ISO }
        }
      };
    }));
    const alvo = alunos.find(a => a.id === id);
    setAviso({ texto: `Resposta do AEE sobre ${primeiroNome(alvo.nome)} enviada à psicologia. O estudo de caso e o PEI já podem incorporar essa contribuição.` });
    setPagina('meusAlunos');
  }

  /* ── psicologia: documentos e comentário ── */
  function gerarDoc(id, tipo) {
    setAlunos(lista => lista.map(a => {
      if (a.id !== id) return a;
      const texto = tipo === 'relatorio' ? gerarRelatorioAcompanhamento(a) : tipo === 'estudo' ? gerarEstudoDeCaso(a) : gerarPEI(a);
      return { ...a, documentos: { ...a.documentos, [tipo]: { texto, status: 'Rascunho' } } };
    }));
    setContexto({ alunoId: id }); setAlunoId(id); setPagina(tipo);
  }
  function abrirDoc(id, tipo) { setContexto({ alunoId: id }); setAlunoId(id); setPagina(tipo); }
  function regerarDoc(id, tipo) {
    setAlunos(lista => lista.map(a => {
      if (a.id !== id) return a;
      const texto = tipo === 'relatorio' ? gerarRelatorioAcompanhamento(a) : tipo === 'estudo' ? gerarEstudoDeCaso(a) : gerarPEI(a);
      return { ...a, documentos: { ...a.documentos, [tipo]: { texto, status: 'Rascunho' } } };
    }));
  }
  function editarTexto(id, tipo, texto) {
    setAlunos(lista => lista.map(a => (a.id === id ? { ...a, documentos: { ...a.documentos, [tipo]: { ...a.documentos[tipo], texto } } } : a)));
  }
  function aprovarDoc(id, tipo) {
    setAlunos(lista => lista.map(a => (a.id === id ? { ...a, documentos: { ...a.documentos, [tipo]: { ...a.documentos[tipo], status: 'Aprovado' } } } : a)));
    const alvo = alunos.find(a => a.id === id);
    setAviso({
      texto: tipo === 'relatorio'
        ? `Relatório de acompanhamento escolar de ${primeiroNome(alvo.nome)} aprovado e vinculado ao prontuário.`
        : tipo === 'estudo'
        ? `Estudo de caso de ${primeiroNome(alvo.nome)} aprovado. Você já pode gerar o PEI a partir dele.`
        : `PEI de ${primeiroNome(alvo.nome)} aprovado e disponível, em leitura, para os professores das turmas.`
    });
  }

  // comentário da psicologia — fica no aluno e entra no PEI na próxima geração
  function comentar(id, texto) {
    const limpo = texto.trim();
    setAlunos(lista => lista.map(a => (
      a.id === id ? { ...a, comentario: limpo ? { texto: limpo, autor: PERFIS.psicologia.nome, data: HOJE_ISO } : null } : a
    )));
    const alvo = alunos.find(a => a.id === id);
    setAviso({
      texto: limpo
        ? `Considerações sobre ${primeiroNome(alvo.nome)} registradas. Serão incorporadas ao PEI na próxima geração do plano.`
        : `Considerações sobre ${primeiroNome(alvo.nome)} removidas.`
    });
  }

  function anexarDocumento(id, categoria, arquivo) {
    const tamanho = arquivo.size >= 1024 * 1024
      ? `${(arquivo.size / (1024 * 1024)).toFixed(1).replace('.', ',')} MB`
      : `${Math.max(1, Math.round(arquivo.size / 1024))} KB`;
    const anexo = {
      id: `anexo-${id}-${Date.now()}`, categoria, nome: arquivo.name,
      tamanho, adicionadoEm: HOJE_ISO, autor: PERFIS.psicologia.nome, resumo: '', arquivo
    };
    setAlunos(lista => lista.map(a => a.id === id ? { ...a, anexos: [...(a.anexos || []), anexo] } : a));
    setAviso({ texto: `${categoria} “${arquivo.name}” anexado ao prontuário fictício. O arquivo permanecerá apenas em memória nesta demonstração.` });
  }

  function salvarComentarioAMI(id, texto) {
    const limpo = texto.trim();
    setAlunos(lista => lista.map(a => a.id === id ? {
      ...a,
      comentarioAMI: limpo ? { texto: limpo, autor: 'Equipe AMI', data: HOJE_ISO } : null
    } : a));
    const alvo = alunos.find(a => a.id === id);
    setAviso({ texto: limpo ? `Comentário da AMI sobre ${primeiroNome(alvo.nome)} registrado.` : `Comentário da AMI sobre ${primeiroNome(alvo.nome)} removido.` });
  }

  function gerarSintese(id) {
    setAlunos(lista => lista.map(a => a.id === id ? {
      ...a,
      sintese: { texto: gerarSinteseCompleta(a), status: 'Rascunho', geradaEm: HOJE_ISO }
    } : a));
    const alvo = alunos.find(a => a.id === id);
    setAviso({ texto: `Síntese completa de ${primeiroNome(alvo.nome)} gerada com todas as fontes disponíveis.` });
  }

  function editarSintese(id, texto) {
    setAlunos(lista => lista.map(a => a.id === id ? { ...a, sintese: { ...a.sintese, texto } } : a));
  }

  function abrirAluno(id) { setAlunoId(id); setPagina('aluno'); }
  function responderFicha(id) { setAlunoId(id); setPagina('ficha'); }
  function responderFichaAEE(id) { setAlunoId(id); setPagina('fichaAEE'); }

  if (!perfil) return <LoginUX aoEntrar={entrar} />;

  const marcas = {};
  if (perfilId === 'professor') {
    const meus = alunosDoProfessor(alunos, perfil);
    const p = meus.filter(a => { const r = fichaDoProfessor(a, perfil.nome); return r && r.status === 'Pendente'; }).length;
    if (p) { marcas.meusAlunos = p; marcas.ficha = p; }
  }
  if (perfilId === 'aee') {
    const meus = alunosDoAEE(alunos);
    const liberadas = meus.filter(a => professoresConcluiram(a) && respostaAEE(a).status === 'Pendente').length;
    if (liberadas) { marcas.meusAlunos = liberadas; marcas.fichaAEE = liberadas; }
  }
  if (perfilId === 'psicologia') {
    const semDoc = alunos.filter(a => enviadas(a).length && (!a.documentos.relatorio || !a.documentos.estudo || !a.documentos.pei)).length;
    const aeePendentes = alunos.filter(a => frequentaAEE(a) && respostaAEE(a).status !== 'Enviado').length;
    if (semDoc || aeePendentes) marcas.respostas = semDoc + aeePendentes;
    const semProf = alunos.filter(a => a.respostas.length === 0).length;
    if (semProf) marcas.atribuicoes = semProf;
  }
  if (perfilId === 'coordenacao') {
    const pend = alunos.reduce((s, a) => s + pendentes(a).length
      + (frequentaAEE(a) && respostaAEE(a).status !== 'Enviado' ? 1 : 0)
      + (!a.documentos.pei || a.documentos.pei.status !== 'Aprovado' ? 1 : 0), 0);
    if (pend) marcas.visaoGeral = pend;
  }

  return (
    <div className="ux-shell fundo-app flex min-h-screen">
      <BarraLateralUX perfil={perfil} pagina={pagina} setPagina={setPagina} marcas={marcas}
        aoSair={() => { setPerfilId(null); setMenuAberto(false); }}
        aberta={menuAberto} fechar={() => setMenuAberto(false)} />

      <div className="flex min-w-0 flex-1 flex-col">
        <header className="ux-topbar sticky top-0 z-30 flex h-[66px] items-center gap-3 px-4 sm:px-6 lg:h-[72px] lg:px-8 xl:px-10">
          <button onClick={() => setMenuAberto(true)} className="-ml-1 grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-tinta-600 shadow-sm hover:border-pei-300 hover:text-pei-700 lg:hidden" aria-label="Abrir menu">
            <Icone nome="menu" className="h-5 w-5" />
          </button>
          <div className="min-w-0 lg:flex lg:items-center lg:gap-2">
            <span className="block truncate text-[13.5px] font-bold text-tinta-900 lg:text-sm">{PAGINAS[pagina].rotulo}</span>
            <span className="hidden text-tinta-300 lg:inline">/</span>
            <span className="hidden text-[11.5px] text-tinta-400 lg:inline">{PAGINAS[pagina].descricao}</span>
          </div>
          <div className="ml-auto flex items-center gap-2.5">
            <span className="hidden rounded-full border border-slate-200 bg-white px-3 py-1.5 text-[10px] font-bold uppercase tracking-[.11em] text-tinta-500 sm:inline">{PERIODO_ATUAL}</span>
            <button onClick={() => setMenuAberto(true)} className="flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-1.5 pr-2.5 shadow-sm lg:pointer-events-none" aria-label="Ver perfil">
              <span className={`grid h-7 w-7 shrink-0 place-items-center rounded-lg text-[10px] font-bold ${perfil.tom}`}>{perfil.sigla}</span>
              <span className="hidden text-[11.5px] font-bold text-tinta-700 sm:inline">{perfil.rotulo}</span>
            </button>
          </div>
        </header>

        <main className="ux-content flex-1 w-full px-4 sm:px-7 lg:px-8 xl:px-10 py-7 sm:py-9 lg:py-10">
          <div className="mx-auto w-full max-w-[1280px]">
            {aviso && (
              <div className="animar-aviso mb-6 flex items-start gap-3 rounded-2xl bg-sabia-50 ring-1 ring-inset ring-sabia-200 px-5 py-4">
                <span className="mt-0.5 text-sabia-600 shrink-0"><Icone nome="check" className="h-[18px] w-[18px]" /></span>
                <p className="flex-1 text-[13.5px] leading-relaxed text-sabia-800">{aviso.texto}</p>
                <button onClick={() => setAviso(null)} className="shrink-0 rounded-lg p-1 text-sabia-600/70 hover:bg-sabia-100 hover:text-sabia-800 transition" aria-label="Fechar aviso">
                  <Icone nome="fechar" className="h-4 w-4" />
                </button>
              </div>
            )}

            <div key={pagina} className="animar-pagina">
              {pagina === 'meusAlunos' && (perfilId === 'aee'
                ? <MeusAlunosAEE alunos={alunos} perfil={perfil} aoResponder={responderFichaAEE} />
                : <MeusAlunos alunos={alunos} perfil={perfil} aoResponder={responderFicha} />)}
              {pagina === 'ficha' && <FichaObservacao alunos={alunos} perfil={perfil} alunoId={alunoId} setAlunoId={setAlunoId} aoEnviar={enviarFicha} />}
              {pagina === 'fichaAEE' && <FichaAEE alunos={alunos} alunoId={alunoId} setAlunoId={setAlunoId} aoEnviar={enviarRespostaAEE} />}
              {pagina === 'atribuicoes' && (
                <Atribuicoes alunos={alunos} aoAlternarDocente={alternarDocente} aoAtribuirTodos={atribuirTodos}
                  aoAlternarAEE={alternarAEE} aoIncluir={incluirAluno} aoRemoverAluno={removerAluno} irPara={setPagina}
                  responsaveisTurma={responsaveisTurma} aoAtribuirPsicologa={atribuirPsicologa} psicologaAtual={perfil.nome} />
              )}
              {pagina === 'respostas' && (
                <RespostasProfessores alunos={alunos} aoGerar={gerarDoc} aoAbrirDoc={abrirDoc} aoAbrirAluno={abrirAluno}
                  aoAbrirAtribuicoes={() => setPagina('atribuicoes')} aoAnexar={anexarDocumento} aoSalvarAMI={salvarComentarioAMI}
                  aoGerarSintese={gerarSintese} aoEditarSintese={editarSintese} />
              )}
              {(pagina === 'relatorio' || pagina === 'estudo' || pagina === 'pei') && (
                <TelaDocumento alunos={alunos} tipo={pagina} contexto={contexto} perfil={perfil}
                  setTexto={editarTexto} aoAprovar={aprovarDoc} aoRegerar={regerarDoc} aoGerar={gerarDoc} aoComentar={comentar}
                  irPara={destino => {
                    if (destino === 'relatorio' || destino === 'pei' || destino === 'estudo') {
                      const alvo = alunos.find(a => a.id === contexto.alunoId);
                      if (!alvo.documentos[destino]) return gerarDoc(contexto.alunoId, destino);
                      return abrirDoc(contexto.alunoId, destino);
                    }
                    setPagina(destino);
                  }} />
              )}
              {pagina === 'aluno' && <PaginaAluno alunos={alunos} alunoId={alunoId} setAlunoId={setAlunoId} irPara={setPagina} somenteLeitura={perfilId === 'coordenacao'} />}
              {pagina === 'visaoGeral' && <VisaoGeral alunos={alunos} aoAbrirAluno={abrirAluno} />}
            </div>
          </div>
        </main>

        <footer className="ux-footer border-t border-slate-200/80 bg-white/60">
          <div className="mx-auto w-full max-w-[1280px] px-4 sm:px-7 lg:px-8 xl:px-10 py-5 flex flex-wrap items-center justify-between gap-3">
            <p className="inline-flex items-center gap-2 text-[12.5px] text-tinta-500">
              <span className="inline-flex items-center gap-1.5 rounded-full bg-ambar-50 px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.1em] text-ambar-600 ring-1 ring-inset ring-ambar-200">
                <span className="h-1.5 w-1.5 rounded-full bg-ambar-400" />Demonstração — dados fictícios
              </span>
              <span className="hidden sm:inline">Nenhum dado real de aluno ou profissional é utilizado nesta apresentação.</span>
            </p>
            <p className="text-[12px] text-tinta-400">Sistema PEI · protótipo · {INSTITUICAO} (instituição fictícia)</p>
          </div>
        </footer>
        <NavegacaoMobile perfil={perfil} pagina={pagina} setPagina={setPagina} marcas={marcas} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
