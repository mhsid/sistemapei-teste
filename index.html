            <textarea value={valor.avaliacao.descricao} maxLength={400} rows={2} onChange={e => mudar('avaliacao', 'descricao', e.target.value)}
              placeholder="Ex.: tempo ampliado, prova segmentada, leitura de enunciados ou formato adaptado."
              className="animar-item mt-3 w-full resize-none rounded-lg border-0 bg-white px-3.5 py-2.5 text-[13.5px] leading-relaxed text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
          )}
        </div>

        <div className={`rounded-xl p-4 ring-1 ring-inset transition ${valor.rotina.usa ? 'bg-pei-50/70 ring-pei-200' : 'bg-white ring-pei-100'}`}>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p className="text-[13.5px] font-medium text-tinta-800">Na rotina diária</p>
              <p className="text-[12px] text-tinta-500 mt-0.5">Há adaptação ou acessibilidade utilizada no cotidiano da sala e dos demais espaços?</p>
            </div>
            <SimNao valor={valor.rotina.usa} aoMudar={v => mudar('rotina', 'usa', v)} />
          </div>
          {valor.rotina.usa && (
            <textarea value={valor.rotina.descricao} maxLength={400} rows={2} onChange={e => mudar('rotina', 'descricao', e.target.value)}
              placeholder="Ex.: rotina visual, lugar com menos estímulos, pausas combinadas ou apoio para transições."
              className="animar-item mt-3 w-full resize-none rounded-lg border-0 bg-white px-3.5 py-2.5 text-[13.5px] leading-relaxed text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
          )}
        </div>

        <div className={`rounded-xl p-4 ring-1 ring-inset transition ${valor.recursos.usa ? 'bg-pei-50/70 ring-pei-200' : 'bg-white ring-pei-100'}`}>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p className="text-[13.5px] font-medium text-tinta-800">Tecnologia assistiva ou recurso material</p>
              <p className="text-[12px] text-tinta-500 mt-0.5">O estudante utiliza algum recurso para acessar, organizar ou realizar as atividades?</p>
            </div>
            <SimNao valor={valor.recursos.usa} aoMudar={v => mudar('recursos', 'usa', v)} />
          </div>
          {valor.recursos.usa && (
            <div className="animar-item mt-3">
              <div className="flex flex-wrap gap-2">
                {RECURSOS_ASSISTIVOS.map(item => {
                  const marcado = valor.recursos.itens.includes(item);
                  return (
                    <button key={item} type="button" onClick={() => alternarRecurso(item)}
                      className={`rounded-full px-3 py-2 text-[12px] font-medium ring-1 ring-inset transition ${marcado ? 'bg-pei-700 text-white ring-pei-700' : 'bg-white text-tinta-600 ring-pei-200 hover:ring-pei-400'}`}>
                      {marcado ? '✓ ' : ''}{item}
                    </button>
                  );
                })}
              </div>
              <input value={valor.recursos.outros} maxLength={160} onChange={e => mudar('recursos', 'outros', e.target.value)}
                placeholder="Outro recurso (opcional)"
                className="mt-3 w-full rounded-lg border-0 bg-white px-3.5 py-2.5 text-[13.5px] text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function FichaObservacao({ alunos, perfil, alunoId, setAlunoId, aoEnviar }) {
  const meus = alunosDoProfessor(alunos, perfil);
  const aluno = meus.find(a => a.id === alunoId) || null;
  const base = aluno ? fichaDoProfessor(aluno, perfil.nome) : null;
  const poliv = aluno ? fichaPolivalente(aluno.segmento) : false;

  const inicial = () => ({
    disciplina: base && base.disciplina ? base.disciplina : '',
    dificuldadeDisciplina: base && base.dificuldadeDisciplina ? { ...base.dificuldadeDisciplina } : { tem: false, texto: '' },
    niveis: base ? { ...base.niveis } : nv(3, 3, 3),
    areasDesc: base && base.areasDesc ? { ...base.areasDesc } : Object.fromEntries(AREAS_DESC.map(x => [x.id, ''])),
    manifestacoes: normalizarManifestacoes(base ? base.manifestacoes : null),
    comentariosBloco: comentariosBlocoDe(base),
    observacoes: base ? base.observacoes : '',
    adaptacao: base ? { ...base.adaptacao } : { necessita: false, quais: '' },
    acessibilidades: acessibilidadesDe(base),
    estrategias: base ? base.estrategias : '',
    outras: base ? base.outras : ''
  });

  const [f, setF] = useState(inicial);
  useEffect(() => { setF(inicial()); }, [alunoId]);

  const set = (campo, v) => setF(x => ({ ...x, [campo]: v }));
  const setNivel = (id, v) => setF(x => ({ ...x, niveis: { ...x.niveis, [id]: v } }));
  const setArea = (id, v) => setF(x => ({ ...x, areasDesc: { ...x.areasDesc, [id]: v } }));
  const setManif = (id, campo, v) => setF(x => ({ ...x, manifestacoes: { ...x.manifestacoes, [id]: { ...x.manifestacoes[id], [campo]: v } } }));
  const setComentarioBloco = (id, v) => setF(x => ({ ...x, comentariosBloco: { ...x.comentariosBloco, [id]: v } }));

  const perfisAtuais = useMemo(() => perfisDe(f.niveis), [f.niveis]);
  const criticos = useMemo(() => ITENS.filter(i => f.niveis[i.id] >= 4), [f.niveis]);
  const jaEnviada = base && base.status === 'Enviado';

  return (
    <div>
      <TituloSecao
        sobretitulo="Ficha de observação"
        titulo="Necessidades no PEI"
        descricao={`Formulário do colégio para o período ${PERIODO_ATUAL}. O que você enviar aqui vai para o ${SETOR}, que consolida as fichas de todos os professores e elabora o estudo de caso e o PEI.`}
      />

      <div className="grid gap-5 lg:grid-cols-[1fr_320px] items-start">
        <div className="space-y-5">
          <Cartao className="p-6">
            <label className="block text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400 mb-2.5">Aluno</label>
            <div className="relative">
              <select value={alunoId || ''} onChange={e => setAlunoId(e.target.value || null)}
                className="w-full appearance-none rounded-xl border-0 bg-pei-50/70 px-4 py-3.5 pr-11 text-[15px] text-tinta-900 ring-1 ring-inset ring-pei-200 focus:ring-2 focus:ring-pei-500 outline-none transition">
                <option value="">Selecione o aluno…</option>
                {meus.map(a => {
                  const r = fichaDoProfessor(a, perfil.nome);
                  return <option key={a.id} value={a.id}>{a.nome} — {a.serie} ({r.status === 'Enviado' ? 'enviada' : 'pendente'})</option>;
                })}
              </select>
              <span className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-pei-500"><Icone nome="baixo" className="h-4 w-4" /></span>
            </div>
            <p className="text-[12px] text-tinta-400 mt-2.5">A lista traz apenas os alunos com PEI nas turmas que você atende.</p>
            {aluno && (
              <div className="mt-4 flex flex-wrap items-center gap-2.5 animar-item">
                <Etiqueta tom="pei">{aluno.segmento}</Etiqueta>
                <Etiqueta>{aluno.turma}</Etiqueta>
                <Etiqueta>{aluno.categoria}</Etiqueta>
                <Etiqueta tom={poliv ? 'ambar' : 'lilas'}>{poliv ? 'Ficha de regência' : 'Ficha por disciplina'}</Etiqueta>
                <Selo status={base ? base.status : 'Pendente'} tamanho="sm" />
              </div>
            )}
          </Cartao>

          {!aluno ? (
            <EstadoVazio icone="ficha" titulo="Selecione um aluno para começar"
              texto="A ficha é individual e segue o formulário do colégio. Nos Anos Iniciais ela é preenchida pela regência; da Fundamental II em diante, uma ficha por disciplina." />
          ) : (
            <>
              {jaEnviada && (
                <div className="animar-item rounded-2xl bg-pei-50 ring-1 ring-inset ring-pei-200 px-5 py-4 flex items-start gap-3">
                  <span className="mt-0.5 text-pei-600"><Icone nome="check" className="h-[18px] w-[18px]" /></span>
                  <p className="text-[13px] text-pei-800 leading-relaxed">
                    Ficha já enviada em <strong className="font-semibold">{formatarData(base.enviadoEm)}</strong>. Você pode ajustar e reenviar —
                    o perfil consolidado do aluno é recalculado automaticamente.
                  </p>
                </div>
              )}

              {/* 1 e 2 — só da Fundamental II em diante */}
              {!poliv && (
                <Cartao className="p-6 animar-item space-y-5">
                  <div>
                    <label className="text-[13.5px] font-medium text-tinta-800">1. Qual a sua disciplina?</label>
                    <input value={f.disciplina} onChange={e => set('disciplina', e.target.value)} placeholder="Ex.: Língua Portuguesa"
                      className="mt-2 w-full rounded-xl border-0 bg-pei-50/70 px-4 py-3 text-[14px] text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
                  </div>
                  <div className="pt-5 border-t border-pei-100">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <label className="text-[13.5px] font-medium text-tinta-800">2. O aluno apresenta dificuldade na sua disciplina?</label>
                      <SimNao valor={f.dificuldadeDisciplina.tem} aoMudar={v => set('dificuldadeDisciplina', { ...f.dificuldadeDisciplina, tem: v })} />
                    </div>
                    <textarea value={f.dificuldadeDisciplina.texto} maxLength={400} rows={2}
                      onChange={e => set('dificuldadeDisciplina', { ...f.dificuldadeDisciplina, texto: e.target.value })}
                      placeholder={f.dificuldadeDisciplina.tem ? 'Explique qual é a dificuldade.' : 'Se quiser, registre o que sustenta o bom desempenho na sua disciplina.'}
                      className="mt-3 w-full resize-none rounded-xl border-0 bg-pei-50/70 px-4 py-3 text-[14px] leading-relaxed text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
                  </div>
                </Cartao>
              )}

              {/* Blocos de nível de dificuldade */}
              {BLOCOS.map((b, idx) => (
                <Cartao key={b.id} className="p-6 animar-item">
                  <div className="flex flex-wrap items-start justify-between gap-4 mb-1">
                    <div className="flex items-start gap-3">
                      <span className="mt-1 h-3 w-3 rounded-full shrink-0" style={{ backgroundColor: b.cor }} />
                      <div>
                        <h3 className="font-serif text-lg font-semibold text-tinta-900">{poliv ? idx + 1 : idx + 3}. {b.nome}</h3>
                        <p className="text-[12.5px] text-tinta-500 mt-1">
                          Nível de dificuldade de 1 a 5 — <strong className="font-medium text-tinta-700">1</strong> indica ausência de dificuldade e
                          <strong className="font-medium text-tinta-700"> 5</strong>, dificuldade acentuada. Registre o que você observa nas suas aulas.
                        </p>
                      </div>
                    </div>
                    <div className="text-right shrink-0">
                      <p className="text-[10.5px] uppercase tracking-[0.12em] text-tinta-400 font-semibold">Faixa predominante</p>
                      <p className="mt-0.5 text-[12px] font-semibold" style={{ color: b.cor }}>{rotuloDesempenho(desempenho(perfisAtuais[b.id]))}</p>
                    </div>
                  </div>
                  <div className="mt-3">
                    {b.itens.map(i => <LinhaItem key={i.id} item={i} valor={f.niveis[i.id]} aoMudar={setNivel} cor={b.cor} />)}
                  </div>
                  <div className="mt-5 border-t border-pei-100 pt-5">
                    <CampoTexto
                      rotulo={`Comentário sobre ${minusculo(b.nome)}`}
                      ajuda="Registre exemplos, situações ou diferenças de contexto que ajudem a interpretar as marcações deste bloco."
                      valor={f.comentariosBloco[b.id]}
                      aoMudar={v => setComentarioBloco(b.id, v)}
                      linhas={2}
                      max={700}
                      placeholder="Ex.: responde melhor quando a atividade é apresentada em etapas e com um exemplo inicial."
                    />
                  </div>
                </Cartao>
              ))}

              {/* Descrição das áreas — só Anos Iniciais */}
              {poliv && (
                <Cartao className="p-6 animar-item space-y-4">
                  <div>
                    <h3 className="font-serif text-lg font-semibold text-tinta-900">4. Descrição do desempenho nas áreas</h3>
                    <p className="text-[12.5px] text-tinta-500 mt-1">Campo aberto — descreva com suas palavras o que observa em cada área.</p>
                  </div>
                  {AREAS_DESC.map(ad => (
                    <CampoTexto key={ad.id} rotulo={ad.rotulo} valor={f.areasDesc[ad.id]} aoMudar={v => setArea(ad.id, v)} linhas={2} max={300}
                      placeholder={`O que você observa em ${minusculo(ad.rotulo)}?`} />
                  ))}
                </Cartao>
              )}

              {/* Manifestações */}
              <Cartao className="p-6 animar-item">
                <h3 className="font-serif text-lg font-semibold text-tinta-900">{poliv ? '5' : '6'}. O aluno apresenta?</h3>
                <p className="text-[12.5px] text-tinta-500 mt-1 mb-4">Marque sim apenas para o que você observou diretamente. Ao marcar sim, descreva como se manifesta.</p>
                <div className="space-y-3">
                  {MANIFESTACOES.filter(m => !m.somenteFund1 || poliv).map(m => (
                    <div key={m.id} className={`rounded-xl px-4 py-3.5 ring-1 ring-inset transition-colors ${f.manifestacoes[m.id].sim ? 'bg-pei-50/60 ring-pei-200' : 'bg-white ring-pei-100'}`}>
                      <div className="flex flex-wrap items-center justify-between gap-3">
                        <span className="text-[13.5px] text-tinta-800">{m.rotulo}</span>
                        <SimNao valor={f.manifestacoes[m.id].sim} aoMudar={v => setManif(m.id, 'sim', v)} />
                      </div>
                      {f.manifestacoes[m.id].sim && (
                        <textarea value={f.manifestacoes[m.id].texto} maxLength={300} rows={2} onChange={e => setManif(m.id, 'texto', e.target.value)}
                          placeholder="Descreva como se manifesta, com que frequência e em que situações."
                          className="animar-item mt-3 w-full resize-none rounded-lg border-0 bg-white px-3.5 py-2.5 text-[13.5px] leading-relaxed text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
                      )}
                    </div>
                  ))}
                </div>
              </Cartao>

              {/* Campos abertos finais */}
              <Cartao className="p-6 animar-item space-y-5">
                <CampoTexto
                  rotulo={`${poliv ? '6' : '7'}. Observações do estudante em sala de aula`}
                  ajuda="Registro concreto do que você observa — será citado textualmente no estudo de caso, com o seu nome."
                  valor={f.observacoes} aoMudar={v => set('observacoes', v)} linhas={3}
                  placeholder="Ex.: entende rápido e termina antes dos colegas quando a tarefa é curta; em listas longas, para na metade." />

                <div className="pt-5 border-t border-pei-100">
                  <BlocoAcessibilidades valor={f.acessibilidades} aoMudar={v => set('acessibilidades', v)} numero={poliv ? '7' : '8'} />
                </div>

                <div className="pt-5 border-t border-pei-100">
                  <CampoTexto rotulo={`${poliv ? '8' : '9'}. Estratégias de intervenção`} ajuda="O que você já faz em sala e tem funcionado."
                    valor={f.estrategias} aoMudar={v => set('estrategias', v)} linhas={2}
                    placeholder="Ex.: dividir a atividade em blocos com pausa combinada entre eles." />
                </div>

                <div className="pt-5 border-t border-pei-100">
                  <CampoTexto rotulo={`${poliv ? '9' : '10'}. Outras informações`} ajuda="Opcional — qualquer informação que ajude a equipe a compreender o caso."
                    valor={f.outras} aoMudar={v => set('outras', v)} linhas={2} placeholder="Opcional." />
                </div>
              </Cartao>
            </>
          )}
        </div>

        <div className="lg:sticky lg:top-6 space-y-4">
          <Cartao className="p-6">
            <h4 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400">Resumo do envio</h4>
            {aluno ? (
              <>
                <div className="mt-4 flex items-center gap-3">
                  <Avatar nome={aluno.nome} />
                  <div className="min-w-0">
                    <p className="font-serif text-[17px] font-semibold text-tinta-900 leading-tight truncate">{aluno.nome}</p>
                    <p className="text-[12.5px] text-tinta-500 mt-0.5">{aluno.serie} · {f.disciplina || base.area}</p>
                  </div>
                </div>

                <div className="mt-5 pt-5 border-t border-pei-100">
                  <p className="text-[11px] uppercase tracking-[0.12em] text-tinta-400 font-semibold mb-3">Perfil que está sendo registrado</p>
                  <PerfilBlocos perfis={perfisAtuais} compacto />
                </div>

                <dl className="mt-5 pt-5 border-t border-pei-100 space-y-3 text-[13px]">
                  <div className="flex justify-between gap-3"><dt className="text-tinta-500">Itens em nível 4 ou 5</dt><dd className="font-medium text-tinta-900 tabular-nums">{criticos.length}</dd></div>
                  <div className="flex justify-between gap-3"><dt className="text-tinta-500">Manifestações marcadas</dt><dd className="font-medium text-tinta-900 tabular-nums">{MANIFESTACOES.filter(m => (!m.somenteFund1 || poliv) && f.manifestacoes[m.id].sim).length}</dd></div>
                  <div className="flex justify-between gap-3"><dt className="text-tinta-500">Acessibilidade em avaliação</dt><dd className="font-medium text-tinta-900">{f.acessibilidades.avaliacao.usa ? 'Sim' : 'Não'}</dd></div>
                  <div className="flex justify-between gap-3"><dt className="text-tinta-500">Acessibilidade na rotina</dt><dd className="font-medium text-tinta-900">{f.acessibilidades.rotina.usa ? 'Sim' : 'Não'}</dd></div>
                  <div className="flex justify-between gap-3"><dt className="text-tinta-500">Recurso assistivo/material</dt><dd className="font-medium text-tinta-900">{f.acessibilidades.recursos.usa ? 'Sim' : 'Não'}</dd></div>
                  <div className="flex justify-between gap-3"><dt className="text-tinta-500">Destino</dt><dd className="font-medium text-tinta-900">Psicologia</dd></div>
                </dl>

                <Botao className="w-full mt-6" onClick={() => aoEnviar(aluno.id, f)}>
                  <Icone nome="enviar" className="h-4 w-4" />{jaEnviada ? 'Reenviar ficha' : 'Enviar ao setor de psicologia'}
                </Botao>
                <p className="text-[11.5px] text-tinta-400 leading-relaxed mt-3 text-center">
                  Você não gera documentos: quem elabora o estudo de caso e o PEI é a psicologia, a partir das fichas de todos os professores.
                </p>
              </>
            ) : (
              <p className="text-[13px] text-tinta-500 mt-3 leading-relaxed">O resumo aparece aqui assim que um aluno for selecionado.</p>
            )}
          </Cartao>

          <div className="rounded-2xl bg-pei-800 p-5 text-pei-100">
            <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-300">Sobre a escala</p>
            <p className="text-[13px] leading-relaxed mt-2.5 text-pei-100/90">
              Todos os itens usam a mesma direção: <strong className="font-semibold text-white">5 significa sempre mais dificuldade</strong>,
              inclusive nos que estão escritos de forma positiva, como “Respeita regras e normas”. Nesses casos, o 5 indica
              dificuldade em cumprir aquilo.
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   8A. PERFIL AEE — Sala de Recursos
       A psicologia define quem frequenta. A resposta só é liberada
       depois que todas as fichas dos professores forem enviadas.
   ═══════════════════════════════════════════════════════════════ */

function MeusAlunosAEE({ alunos, perfil, aoResponder }) {
  const meus = alunosDoAEE(alunos);
  const bloqueados = meus.filter(a => !professoresConcluiram(a));
  const pendentesAee = meus.filter(a => professoresConcluiram(a) && respostaAEE(a).status === 'Pendente');
  const enviados = meus.filter(a => respostaAEE(a).status === 'Enviado');
  const hora = new Date().getHours();
  const saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';

  return (
    <div className="flex flex-col gap-8">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p className="text-[11px] font-semibold uppercase tracking-[0.16em] text-pei-500 mb-2">Atendimento Educacional Especializado</p>
          <h2 className="font-serif text-[28px] sm:text-[34px] leading-tight text-tinta-900 font-semibold">{saudacao}, {primeiroNome(perfil.nome)}.</h2>
          <p className="text-[15px] text-tinta-500 mt-2">
            {pendentesAee.length
              ? `${pendentesAee.length} ${pendentesAee.length === 1 ? 'resposta está liberada' : 'respostas estão liberadas'} para preenchimento.`
              : 'Nenhuma nova resposta do AEE está liberada neste momento.'}
          </p>
        </div>
        <p className="text-[13px] text-tinta-400">{dataPorExtenso(HOJE_ISO)}</p>
      </div>

      <Cartao className="grid sm:grid-cols-3 divide-y sm:divide-y-0 sm:divide-x divide-pei-100">
        {[
          { rot: 'estudantes na Sala de Recursos', val: meus.length, ic: 'pessoas', tom: 'bg-pei-50 ring-pei-200 text-pei-600' },
          { rot: 'aguardando fichas docentes', val: bloqueados.length, ic: 'cadeado', tom: 'bg-ambar-50 ring-ambar-200 text-ambar-600' },
          { rot: 'respostas do AEE enviadas', val: enviados.length, ic: 'check', tom: 'bg-sabia-50 ring-sabia-200 text-sabia-600' }
        ].map(it => (
          <div key={it.rot} className="flex items-center gap-3.5 px-5 sm:px-6 py-4">
            <span className={`grid h-9 w-9 shrink-0 place-items-center rounded-lg ring-1 ${it.tom}`}><Icone nome={it.ic} className="h-[18px] w-[18px]" /></span>
            <div><span className="font-serif text-[26px] leading-none font-semibold text-tinta-900">{it.val}</span><p className="text-[12.5px] text-tinta-500 leading-snug mt-1">{it.rot}</p></div>
          </div>
        ))}
      </Cartao>

      {meus.length === 0 ? (
        <EstadoVazio icone="cadeado" titulo="Nenhum estudante liberado para o AEE"
          texto="Os estudantes aparecem aqui somente depois que o setor de psicologia marca que frequentam a Sala de Recursos." />
      ) : (
        <div className="space-y-3">
          {meus.map((a, i) => {
            const concluido = professoresConcluiram(a);
            const status = statusFluxoAEE(a);
            const raee = respostaAEE(a);
            return (
              <Cartao key={a.id} className="animar-item p-5" style={{ animationDelay: `${i * 55}ms` }}>
                <div className="flex flex-wrap items-center gap-x-5 gap-y-4">
                  <Avatar nome={a.nome} />
                  <div className="min-w-0 flex-1">
                    <h3 className="font-serif text-[17px] font-semibold text-tinta-900 leading-snug">{a.nome}</h3>
                    <p className="text-[13px] text-tinta-500 mt-0.5">{a.serie} · {a.segmento} · Sala de Recursos</p>
                    <div className="flex flex-wrap items-center gap-2 mt-2.5">
                      <Etiqueta tom="lilas">AEE</Etiqueta>
                      <Selo status={status} tamanho="sm" />
                      <span className="text-[12px] text-tinta-400">{enviadas(a).length}/{a.respostas.length} fichas docentes</span>
                    </div>
                    {!concluido && (
                      <p className="mt-2.5 text-[12.5px] leading-relaxed text-ambar-600">
                        A resposta será liberada quando {listar(pendentes(a).map(r => r.disciplina || r.area))} concluir{pendentes(a).length > 1 ? 'em' : ''} o envio.
                      </p>
                    )}
                    {raee.status === 'Enviado' && raee.evolucao && (
                      <p className="mt-2.5 line-clamp-2 text-[12.5px] leading-relaxed text-tinta-500">Último registro: {raee.evolucao}</p>
                    )}
                  </div>
                  <Botao variante={concluido && raee.status === 'Pendente' ? 'primario' : 'secundario'} disabled={!concluido}
                    className="w-full justify-center px-3.5 py-2 text-[13px] sm:w-auto" onClick={() => aoResponder(a.id)}>
                    {!concluido ? <><Icone nome="cadeado" className="h-4 w-4" />Aguardar professores</> : raee.status === 'Enviado' ? 'Rever resposta do AEE' : 'Responder pelo AEE'}
                  </Botao>
                </div>
              </Cartao>
            );
          })}
        </div>
      )}

      <div className="rounded-2xl bg-pei-800 p-5 text-pei-100">
        <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-300">Sequência do fluxo</p>
        <p className="text-[13px] leading-relaxed mt-2.5 text-pei-100/90">
          Primeiro, os professores concluem as fichas da sala regular. Em seguida, o AEE registra o atendimento da Sala de Recursos. A psicologia recebe as duas perspectivas para elaborar o estudo de caso e o PEI.
        </p>
      </div>
    </div>
  );
}

function FichaAEE({ alunos, alunoId, setAlunoId, aoEnviar }) {
  const meus = alunosDoAEE(alunos);
  const aluno = meus.find(a => a.id === alunoId) || null;
  const inicial = () => {
    const base = aluno ? respostaAEE(aluno) : respostaAEEVazia();
    return { ...base, recursos: [...(base.recursos || [])] };
  };
  const [f, setF] = useState(inicial);
  useEffect(() => { setF(inicial()); }, [alunoId]);
  const set = (campo, valor) => setF(x => ({ ...x, [campo]: valor }));
  const alternarRecurso = recurso => setF(x => ({
    ...x,
    recursos: x.recursos.includes(recurso) ? x.recursos.filter(r => r !== recurso) : [...x.recursos, recurso]
  }));

  const liberada = aluno ? professoresConcluiram(aluno) : false;
  const pronta = f.objetivos.trim() && f.intervencoes.trim() && f.evolucao.trim();
  const jaEnviada = aluno && respostaAEE(aluno).status === 'Enviado';

  return (
    <div>
      <TituloSecao sobretitulo="Sala de Recursos" titulo="Resposta do AEE"
        descricao={`Registro especializado do período ${PERIODO_ATUAL}. O formulário é liberado somente após a conclusão das fichas dos professores da sala regular.`} />

      <div className="grid gap-5 lg:grid-cols-[1fr_320px] items-start">
        <div className="space-y-5">
          <Cartao className="p-6">
            <label className="block text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400 mb-2.5">Estudante atendido na Sala de Recursos</label>
            <select value={alunoId || ''} onChange={e => setAlunoId(e.target.value || null)}
              className="w-full appearance-none rounded-xl border-0 bg-pei-50/70 px-4 py-3.5 text-[15px] text-tinta-900 ring-1 ring-inset ring-pei-200 focus:ring-2 focus:ring-pei-500 outline-none transition">
              <option value="">Selecione um estudante</option>
              {meus.map(a => <option key={a.id} value={a.id}>{a.nome} — {a.serie}{professoresConcluiram(a) ? '' : ' · aguardando professores'}</option>)}
            </select>
          </Cartao>

          {!aluno ? (
            <EstadoVazio icone="ficha" titulo={meus.length ? 'Selecione um estudante' : 'Nenhum estudante vinculado ao AEE'}
              texto={meus.length ? 'Escolha acima o estudante cujo atendimento será registrado.' : 'A psicologia ainda não marcou nenhum estudante como frequentador da Sala de Recursos.'} />
          ) : !liberada ? (
            <Cartao className="p-7 sm:p-9">
              <div className="flex flex-col items-center text-center">
                <span className="grid h-14 w-14 place-items-center rounded-2xl bg-ambar-50 text-ambar-600 ring-1 ring-inset ring-ambar-200"><Icone nome="cadeado" className="h-6 w-6" /></span>
                <h3 className="mt-5 font-serif text-xl font-semibold text-tinta-900">Resposta ainda bloqueada</h3>
                <p className="mt-2 max-w-xl text-[13.5px] leading-relaxed text-tinta-500">
                  {primeiroNome(aluno.nome)} frequenta a Sala de Recursos, mas o AEE responde depois dos professores. Faltam {pendentes(aluno).length} de {aluno.respostas.length} fichas docentes.
                </p>
                <div className="mt-5 flex flex-wrap justify-center gap-2">
                  {pendentes(aluno).map(r => <Etiqueta key={r.area + r.professor} tom="ambar">{r.disciplina || r.area} · pendente</Etiqueta>)}
                </div>
              </div>
            </Cartao>
          ) : (
            <>
              <Cartao className="p-6 animar-item space-y-5">
                <div>
                  <h3 className="font-serif text-lg font-semibold text-tinta-900">1. Contexto do atendimento</h3>
                  <p className="text-[12.5px] text-tinta-500 mt-1">Descreva a participação do estudante na Sala de Recursos.</p>
                </div>
                <div>
                  <label className="text-[13.5px] font-medium text-tinta-800">Frequência no atendimento</label>
                  <select value={f.frequencia} onChange={e => set('frequencia', e.target.value)}
                    className="mt-2 w-full appearance-none rounded-xl border-0 bg-pei-50/70 px-4 py-3 text-[14px] text-tinta-900 ring-1 ring-inset ring-pei-200 focus:ring-2 focus:ring-pei-500 outline-none transition">
                    <option value="">Selecione</option>
                    <option>Regular — duas vezes por semana</option>
                    <option>Regular — uma vez por semana</option>
                    <option>Oscilante</option>
                    <option>Atendimento iniciado recentemente</option>
                  </select>
                </div>
                <CampoTexto rotulo="Potencialidades observadas" ajuda="Interesses, habilidades preservadas e condições que favorecem a participação."
                  valor={f.potencialidades} aoMudar={v => set('potencialidades', v)} linhas={3} max={800}
                  placeholder="Ex.: responde bem a apoios visuais e demonstra boa memória para sequências." />
              </Cartao>

              <Cartao className="p-6 animar-item space-y-5">
                <div><h3 className="font-serif text-lg font-semibold text-tinta-900">2. Trabalho desenvolvido</h3><p className="text-[12.5px] text-tinta-500 mt-1">Campos essenciais para compor o estudo de caso e o PEI.</p></div>
                <CampoTexto rotulo="Objetivos trabalhados *" valor={f.objetivos} aoMudar={v => set('objetivos', v)} linhas={4} max={1000}
                  placeholder="Quais habilidades e barreiras foram priorizadas no período?" />
                <CampoTexto rotulo="Intervenções realizadas *" valor={f.intervencoes} aoMudar={v => set('intervencoes', v)} linhas={4} max={1000}
                  placeholder="Descreva as atividades, mediações e estratégias utilizadas na Sala de Recursos." />
              </Cartao>

              <Cartao className="p-6 animar-item">
                <h3 className="font-serif text-lg font-semibold text-tinta-900">3. Tecnologias assistivas e recursos</h3>
                <p className="text-[12.5px] text-tinta-500 mt-1 mb-4">Marque tudo o que foi efetivamente utilizado no atendimento.</p>
                <div className="flex flex-wrap gap-2">
                  {RECURSOS_AEE.map(recurso => {
                    const marcado = f.recursos.includes(recurso);
                    return <button key={recurso} type="button" onClick={() => alternarRecurso(recurso)}
                      className={`rounded-full px-3 py-2 text-[12px] font-medium ring-1 ring-inset transition ${marcado ? 'bg-pei-700 text-white ring-pei-700' : 'bg-white text-tinta-600 ring-pei-200 hover:ring-pei-400'}`}>{marcado ? '✓ ' : ''}{recurso}</button>;
                  })}
                </div>
                <input value={f.recursosOutros} maxLength={220} onChange={e => set('recursosOutros', e.target.value)} placeholder="Outro recurso utilizado (opcional)"
                  className="mt-4 w-full rounded-xl border-0 bg-pei-50/70 px-4 py-3 text-[14px] text-tinta-900 ring-1 ring-inset ring-pei-200 placeholder:text-tinta-400 focus:ring-2 focus:ring-pei-500 outline-none transition" />
              </Cartao>

              <Cartao className="p-6 animar-item space-y-5">
                <div><h3 className="font-serif text-lg font-semibold text-tinta-900">4. Evolução e articulação</h3><p className="text-[12.5px] text-tinta-500 mt-1">Relacione o atendimento especializado à participação na sala regular.</p></div>
                <CampoTexto rotulo="Resposta às intervenções e evolução *" valor={f.evolucao} aoMudar={v => set('evolucao', v)} linhas={4} max={1200}
                  placeholder="O que mudou ao longo do período? Quais apoios já podem ser reduzidos ou precisam ser mantidos?" />
                <CampoTexto rotulo="Articulação com a sala regular" valor={f.articulacao} aoMudar={v => set('articulacao', v)} linhas={4} max={1000}
                  placeholder="O que deve ser compartilhado ou generalizado com os professores?" />
                <CampoTexto rotulo="Orientações e próximos passos" valor={f.orientacoes} aoMudar={v => set('orientacoes', v)} linhas={3} max={1000}
                  placeholder="Recomendações do AEE para o próximo ciclo." />
                <CampoTexto rotulo="Observações complementares" valor={f.observacoes} aoMudar={v => set('observacoes', v)} linhas={3} max={800} placeholder="Opcional." />
              </Cartao>
            </>
          )}
        </div>

        <div className="lg:sticky lg:top-6 space-y-4">
          <Cartao className="p-6">
            <h4 className="text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400">Resumo do fluxo</h4>
            {aluno ? <>
              <div className="mt-4 flex items-center gap-3"><Avatar nome={aluno.nome} /><div><p className="font-serif text-[17px] font-semibold text-tinta-900">{aluno.nome}</p><p className="text-[12.5px] text-tinta-500">{aluno.serie} · Sala de Recursos</p></div></div>
              <dl className="mt-5 space-y-3 border-t border-pei-100 pt-5 text-[13px]">
                <div className="flex justify-between gap-3"><dt className="text-tinta-500">Fichas docentes</dt><dd className="font-medium text-tinta-900">{enviadas(aluno).length}/{aluno.respostas.length}</dd></div>
                <div className="flex justify-between gap-3"><dt className="text-tinta-500">Resposta do AEE</dt><dd><Selo status={statusFluxoAEE(aluno)} tamanho="sm" /></dd></div>
                <div className="flex justify-between gap-3"><dt className="text-tinta-500">Recursos marcados</dt><dd className="font-medium text-tinta-900">{f.recursos.length}</dd></div>
                <div className="flex justify-between gap-3"><dt className="text-tinta-500">Destino</dt><dd className="font-medium text-tinta-900">Psicologia</dd></div>
              </dl>
              <Botao className="mt-6 w-full" disabled={!liberada || !pronta} onClick={() => aoEnviar(aluno.id, f)}>
                <Icone nome="enviar" className="h-4 w-4" />{jaEnviada ? 'Reenviar resposta do AEE' : 'Enviar resposta do AEE'}
              </Botao>
              {liberada && !pronta && <p className="mt-3 text-center text-[11.5px] leading-relaxed text-tinta-400">Preencha objetivos, intervenções e evolução para liberar o envio.</p>}
            </> : <p className="mt-3 text-[13px] leading-relaxed text-tinta-500">Selecione um estudante para visualizar a etapa e iniciar o registro.</p>}
          </Cartao>
          <div className="rounded-2xl bg-lilas-50 p-5 ring-1 ring-inset ring-lilas-200">
            <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-lilas-600">Uso da resposta</p>
            <p className="mt-2.5 text-[12.5px] leading-relaxed text-lilas-600">Depois do envio, a psicologia visualiza este registro abaixo das fichas docentes e pode regenerar o estudo de caso e o PEI com a contribuição do AEE.</p>
          </div>
        </div>
      </div>
    </div>
  );
}
/* ═══════════════════════════════════════════════════════════════════
   8B. PERFIL PSICOLOGIA — atribuições
       Montagem do ciclo: quais alunos de cada turma entram no
       acompanhamento e quais professores respondem por cada um.
   ═══════════════════════════════════════════════════════════════ */

function ChipDocente({ docente, resposta, aoAlternar, bloqueado = false }) {
  const atribuido = !!resposta;
  const enviada = atribuido && resposta.status === 'Enviado';
  const rotulo = docente.disciplina || docente.papel;

  return (
    <button
      type="button"
      onClick={() => !enviada && !bloqueado && aoAlternar(docente)}
      disabled={enviada || bloqueado}
      title={bloqueado ? 'Apenas a psicóloga responsável pela turma pode alterar esta equipe' : enviada ? `Ficha já enviada em ${formatarData(resposta.enviadoEm)} — não pode ser removida` : atribuido ? 'Clique para remover a atribuição' : 'Clique para atribuir'}
      className={`group flex items-start gap-2.5 rounded-xl px-3.5 py-2.5 text-left transition-all duration-200 ring-1 ring-inset ${
        enviada ? 'bg-sabia-50 ring-sabia-200 cursor-default'
        : atribuido ? 'bg-pei-50 ring-pei-300 hover:ring-telha-300 hover:bg-telha-50'
        : 'bg-white ring-pei-200 hover:ring-pei-400 hover:bg-pei-50/50'
      } ${bloqueado ? 'cursor-not-allowed opacity-60' : ''}`}
    >
      <span className={`mt-0.5 grid h-[18px] w-[18px] shrink-0 place-items-center rounded-md ring-1 transition ${
        enviada ? 'bg-sabia-600 ring-sabia-600 text-white'
        : atribuido ? 'bg-pei-700 ring-pei-700 text-white'
        : 'bg-white ring-pei-300 text-transparent'
      }`}>
        <Icone nome="check" className="h-2.5 w-2.5" />
      </span>
      <span className="min-w-0">
        <span className={`block text-[12.5px] font-medium leading-snug ${atribuido ? 'text-tinta-900' : 'text-tinta-600'}`}>{rotulo}</span>
        <span className="block text-[11.5px] text-tinta-500 leading-snug mt-0.5">{docente.nome}</span>
        {enviada && <span className="block text-[11px] text-sabia-700 mt-1">ficha enviada em {formatarData(resposta.enviadoEm)}</span>}
      </span>
    </button>
  );
}

function Atribuicoes({ alunos, aoAlternarDocente, aoAtribuirTodos, aoAlternarAEE, aoIncluir, aoRemoverAluno, irPara, responsaveisTurma, aoAtribuirPsicologa, psicologaAtual }) {
  const [segmento, setSegmento] = useState('Todos');
  const [aberto, setAberto] = useState(null);

  const turmas = TURMAS.filter(t => segmento === 'Todos' || t.segmento === segmento);
  const noCiclo = alunos.length;
  const totalMatriculados = alunos.length + MATRICULADOS.filter(m => !alunos.some(a => a.matriculaId === m.id)).length;
  const totalAtribuicoes = alunos.reduce((s, a) => s + a.respostas.length, 0);
  const totalPendentes = alunos.reduce((s, a) => s + pendentes(a).length, 0);
  const totalAEE = alunos.filter(frequentaAEE).length;
  const semProfessor = alunos.filter(a => a.respostas.length === 0);

  return (
    <div className="space-y-7">
      <TituloSecao
        sobretitulo="Psicologia · montagem do ciclo"
        titulo="Turmas, triagem e atribuições"
        descricao={`Atribua cada turma a uma psicóloga. A responsável visualiza a lista completa, marca quem necessita de PEI e então define professores, aulas integradas e participação na Sala de Recursos.`}
      />

      {semProfessor.length > 0 && (
        <div className="animar-item flex items-start gap-3 rounded-2xl bg-ambar-50 ring-1 ring-inset ring-ambar-200 px-5 py-4">
          <span className="mt-0.5 text-ambar-500 shrink-0"><Icone nome="alerta" className="h-[18px] w-[18px]" /></span>
          <p className="flex-1 text-[13.5px] leading-relaxed text-ambar-600">
            {semProfessor.length === 1 ? 'Um aluno está' : `${semProfessor.length} alunos estão`} no acompanhamento
            <strong className="font-semibold"> sem nenhum professor atribuído</strong> — {listar(semProfessor.map(a => primeiroNome(a.nome)))}.
            Nenhuma ficha será gerada enquanto isso não for definido.
          </p>
        </div>
      )}

      <Cartao className="grid sm:grid-cols-2 xl:grid-cols-4 divide-y sm:divide-y-0 sm:divide-x divide-pei-100">
        {[
          { rot: 'estudantes nas listas de turma', val: totalMatriculados, ic: 'pessoas', tom: 'bg-pei-50 ring-pei-200 text-pei-600' },
          { rot: totalAtribuicoes === 1 ? 'atribuição ativa' : 'atribuições ativas', val: totalAtribuicoes, ic: 'lista', tom: 'bg-lilas-50 ring-lilas-200 text-lilas-500' },
          { rot: totalPendentes === 1 ? 'ficha pendente' : 'fichas pendentes', val: totalPendentes, ic: 'ficha', tom: 'bg-ambar-50 ring-ambar-200 text-ambar-500' },
          { rot: 'estudantes na Sala de Recursos', val: totalAEE, ic: 'faisca', tom: 'bg-sabia-50 ring-sabia-200 text-sabia-600' }
        ].map(it => (
          <div key={it.rot} className="flex items-center gap-3.5 px-5 sm:px-6 py-4">
            <span className={`grid h-9 w-9 shrink-0 place-items-center rounded-lg ring-1 ${it.tom}`}><Icone nome={it.ic} className="h-[18px] w-[18px]" /></span>
            <div className="min-w-0">
              <span className="font-serif text-[26px] leading-none font-semibold text-tinta-900">{it.val}</span>
              <p className="text-[12.5px] text-tinta-500 leading-snug mt-1">{it.rot}</p>
            </div>
          </div>
        ))}
      </Cartao>

      <Filtro rotulo="Segmento:" opcoes={['Todos', ...SEGMENTOS]} valor={segmento} aoMudar={setSegmento} />

      <div className="space-y-4">
        {turmas.map((t, ti) => {
          const daTurma = alunos.filter(a => a.turmaId === t.id);
          const candidatos = MATRICULADOS.filter(m => m.turmaId === t.id && !alunos.some(a => a.matriculaId === m.id));
          const docentes = docentesDoSegmento(t.segmento);
          const docentesRegulares = docentes.filter(d => !d.integrada);
          const docentesIntegradas = docentes.filter(d => d.integrada);
          const responsavel = PSICOLOGAS.find(p => p.id === responsaveisTurma[t.id]) || null;
          const podeTriar = !!responsavel && responsavel.nome === psicologaAtual;
          const totalTurma = daTurma.length + candidatos.length;

          return (
            <Cartao key={t.id} className="animar-item overflow-hidden" style={{ animationDelay: `${ti * 55}ms` }}>
              <div className="flex flex-wrap items-center justify-between gap-4 px-5 sm:px-6 py-4 border-b border-pei-100 bg-pei-50/40">
                <div>
                  <h3 className="font-serif text-[17px] font-semibold text-tinta-900">{t.nome}</h3>
                  <p className="text-[12.5px] text-tinta-500 mt-0.5">{t.segmento} · turno {t.turno} · {totalTurma} estudantes · {daTurma.length} com indicação de PEI</p>
                </div>
                <label className="w-full min-w-[230px] sm:w-auto">
                  <span className="mb-1.5 block text-[10.5px] font-semibold uppercase tracking-[0.12em] text-tinta-400">Psicóloga responsável</span>
                  <select value={responsaveisTurma[t.id] || ''} onChange={e => aoAtribuirPsicologa(t.id, e.target.value)}
                    className="w-full rounded-xl border-0 bg-white px-3.5 py-2.5 text-[12.5px] font-medium text-tinta-800 ring-1 ring-inset ring-pei-200 focus:ring-2 focus:ring-pei-400 outline-none">
                    <option value="">Selecione…</option>
                    {PSICOLOGAS.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
                  </select>
                </label>
              </div>

              {!podeTriar && (
                <div className="flex items-start gap-3 border-b border-pei-100 bg-slate-50 px-5 py-3 sm:px-6">
                  <Icone nome="cadeado" className="mt-0.5 h-4 w-4 shrink-0 text-tinta-400" />
                  <p className="text-[12px] leading-relaxed text-tinta-500">A triagem desta turma está com <strong className="font-medium text-tinta-700">{responsavel ? responsavel.nome : 'nenhuma psicóloga'}</strong>. Você pode consultar a lista ou atribuir a turma a si para editar.</p>
                </div>
              )}

              {daTurma.length > 0 && (
                <ul className="divide-y divide-pei-100">
                  {daTurma.map(a => {
                    const expandido = aberto === a.id;
                    const envs = enviadas(a);
                    const podeRemover = envs.length === 0 && !a.documentos.relatorio && !a.documentos.estudo && !a.documentos.pei;
                    return (
                      <li key={a.id}>
                        <div className="flex flex-wrap items-center gap-x-4 gap-y-3 px-5 sm:px-6 py-4">
                          <Avatar nome={a.nome} tamanho="sm" />
                          <div className="min-w-0 flex-1">
                            <p className="text-[14.5px] font-medium text-tinta-900 leading-snug">{a.nome}</p>
                            <div className="flex flex-wrap items-center gap-2 mt-1.5">
                              <Etiqueta tom="pei">{a.categoria}</Etiqueta>
                              <Etiqueta tom="sabia">PEI necessário</Etiqueta>
                              {a.respostas.length === 0 ? (
                                <Etiqueta tom="ambar">sem professor atribuído</Etiqueta>
                              ) : (
                                <span className="text-[12.5px] text-tinta-500">
                                  {a.respostas.length} {a.respostas.length === 1 ? 'professor atribuído' : 'professores atribuídos'} · {envs.length} {envs.length === 1 ? 'ficha recebida' : 'fichas recebidas'}
                                </span>
                              )}
                              {frequentaAEE(a) && <Etiqueta tom="lilas">Sala de Recursos · {statusFluxoAEE(a)}</Etiqueta>}
                            </div>
                          </div>
                          <div className="flex items-center gap-2 shrink-0">
                            <Botao variante="secundario" className="px-3.5 py-2 text-[13px]" disabled={!podeTriar} onClick={() => setAberto(expandido ? null : a.id)}>

              )}

              {candidatos.length > 0 && (
                <div className={`px-5 sm:px-6 py-4 ${daTurma.length ? 'border-t border-pei-100' : ''} bg-white`}>
                  <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
                    <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-tinta-400">Demais estudantes da turma</p>
                    <Etiqueta>{candidatos.length} sem indicação de PEI</Etiqueta>
                  </div>
                    <ul className="space-y-2">
                      {candidatos.map(m => (
                        <li key={m.id} className="flex flex-wrap items-center gap-x-4 gap-y-2 rounded-xl bg-pei-50/50 ring-1 ring-inset ring-pei-100 px-4 py-3">
                          <Avatar nome={m.nome} tamanho="sm" />
                          <div className="min-w-0 flex-1">
                            <p className="text-[14px] font-medium text-tinta-800 leading-snug">{m.nome}</p>
                            <p className="text-[12px] text-tinta-500 mt-0.5">{m.idade} anos · hipótese/necessidade registrada para triagem: {m.hipotese}</p>
                          </div>
                          <Botao className="px-3.5 py-2 text-[13px] shrink-0" disabled={!podeTriar} onClick={() => aoIncluir(m.id)}>
                            Marcar necessidade de PEI
                          </Botao>
                        </li>
                      ))}
                    </ul>
                </div>
              )}
            </Cartao>
          );
        })}
      </div>

      <div className="rounded-2xl bg-pei-800 p-5 text-pei-100">
        <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-pei-300">Como as atribuições chegam às equipes</p>
        <p className="text-[13px] leading-relaxed mt-2.5 text-pei-100/90">
          Ao atribuir um professor, uma ficha em branco aparece imediatamente na tela “Meus alunos” dele, marcada como
          pendente. Para o AEE, o estudante aparece somente quando a psicologia marca a Sala de Recursos; o formulário fica bloqueado até todos os professores responderem.
        </p>
      </div>
    </div>
  );
}
